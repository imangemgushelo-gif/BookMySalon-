<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Details - BookMySalon</title>
<meta name="theme-color" content="#2a0a45">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "cbc1f3f3-aebe-46e6-95f8-6ceb354120b1",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      allowLocalhostAsSecureOrigin: true,
    });
  });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff;padding:20px;padding-bottom:80px;color:#111}
.box{max-width:600px;margin:0 auto}
.logo{font-size:28px;font-weight:900;color:#2a0a45}
.logo span{color:#c2a06e}
a{color:#2a0a45;text-decoration:none;font-weight:700}
.card{background:#fff;padding:16px;border-radius:16px;border:1px solid #eee;box-shadow:0 4px 16px rgba(0,0,0,.05);margin:14px 0}
input{width:100%;padding:13px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:15px;margin:6px 0 10px;outline:none}
.btn{width:100%;background:#2a0a45;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.service-btn{display:flex;justify-content:space-between;width:100%;padding:12px;border:1px solid #eee;border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer;text-align:left}
.service-btn.selected{border-color:#2a0a45;background:#f3e8ff}
.small{font-size:13px;color:#777}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.gallery img{width:100%;height:240px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}
.success{background:#dcfce7;border:1px solid #86efac;padding:12px;border-radius:12px;display:none;margin-top:10px;font-size:14px;color:#166534}
</style>
</head>
<body>
<div class="box">
<div class="logo">Book<span>My</span>Salon</div>
<p style="margin:10px 0"><a href="index.html">← Back to all salons</a></p>
<div id="salonDetail"><p class="small">Loading salon...</p></div>
<div class="card">
<h3>Book this salon</h3>
<div id="services"></div>
<label style="font-weight:700;font-size:13px">Your Name</label>
<input id="customerName" placeholder="Your full name">
<label style="font-weight:700;font-size:13px">Your Phone</label>
<input id="customerPhone" placeholder="Your phone number">
<label style="font-weight:700;font-size:13px">Date</label>
<input type="date" id="bookingDate">
<label style="font-weight:700;font-size:13px">Time</label>
<input type="time" id="bookingTime" value="10:00">
<button class="btn" onclick="confirmBooking()">Confirm Booking →</button>
<div class="success" id="bookingSuccess">✅ Booking sent! The salon will confirm it.</div>
</div>
<div class="card">
<h3>⭐ Reviews</h3>
<div id="reviews"></div>
</div>
</div>
<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let salon=null, selectedService=null;
const id = new URLSearchParams(location.search).get('id');
async function load(){
  if(!id){ document.getElementById('salonDetail').innerHTML='<p>Salon not found. <a href="index.html">Go home</a></p>'; return; }
  const {data} = await supabaseClient.from('salons').select('*').eq('id',id).single();
  salon=data;
  if(!salon){ document.getElementById('salonDetail').innerHTML='<p>Salon not found.</p>'; return; }
  document.title = salon.name + ' - BookMySalon';
  const photos = salon.photos && salon.photos.length ? salon.photos : (salon.photo_url ? [salon.photo_url] : []);
  document.getElementById('salonDetail').innerHTML = `
    ${photos.length ? `<div class="card" style="padding:0;overflow:hidden"><div class="gallery">${photos.map(u=>`<img src="${u}">`).join('')}</div></div>` : ''}
    <div class="card"><h2>${salon.name}</h2><p class="small" style="margin-top:6px">${salon.address||''}</p><p style="margin-top:8px;color:#111">${salon.description||''}</p><p class="small" style="margin-top:8px">📞 ${salon.phone||''}</p></div>`;
  document.getElementById('services').innerHTML = (salon.services||[]).map((s,i)=>`<button class="service-btn" id="svc-${i}" onclick="selectService(${i})"><span>${s.name}</span><b>R${s.price}</b></button>`).join('') || '<p class="small">Services coming soon</p>';
  const {data:ratings} = await supabaseClient.from('ratings').select('*').eq('salon_id',id).order('created_at',{ascending:false});
  document.getElementById('reviews').innerHTML = (!ratings||!ratings.length) ? '<p class="small">No reviews yet.</p>' : ratings.map(r=>`<p style="margin:8px 0">⭐ ${r.rating} - ${r.comment||''}</p>`).join('');
}
function selectService(i){
  selectedService = salon.services[i];
  document.querySelectorAll('.service-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('svc-'+i).classList.add('selected');
}
async function confirmBooking(){
  if(!selectedService){ alert('Please choose a service'); return; }
  const customer_name=document.getElementById('customerName').value.trim();
  const customer_phone=document.getElementById('customerPhone').value.trim();
  const booking_date=document.getElementById('bookingDate').value;
  const booking_time=document.getElementById('bookingTime').value;
  if(!customer_name||!customer_phone||!booking_date||!booking_time){ alert('Please fill all fields'); return; }
  const {error}=await supabaseClient.from('bookings').insert([{salon_id:salon.id,service:selectedService.name,price:selectedService.price,customer_name,customer_phone,booking_date,booking_time,status:'pending'}]);
  if(error){ alert(error.message); return; }
  document.getElementById('bookingSuccess').style.display='block';
}
document.getElementById('bookingDate').min=new Date().toISOString().split('T')[0];
load();
</script>
</body>
  </html>
