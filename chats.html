<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats - BookMySalon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f6f6f6;padding-bottom:90px}
.header{background:#1a8a4a;color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.header a{color:#fff;text-decoration:none;font-size:22px}
.header h1{font-size:19px;flex:1}
.list{padding:12px}
.chat-card{background:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.avatar{width:52px;height:52px;border-radius:50%;background:#e8f5ee;color:#1a8a4a;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.info{flex:1;min-width:0}
.top-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:#888;flex-shrink:0}
.last{font-size:13px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{background:#e53935;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{text-align:center;padding:60px 20px;color:#888}
.empty div{font-size:48px;margin-bottom:12px}
/* Conversation view */
.conv{display:none;flex-direction:column;height:calc(100vh - 130px)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.4}
.msg.mine{background:#1a8a4a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.theirs{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:4px}
.sendbar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
.sendbar input{flex:1;padding:12px;border:1px solid #ddd;border-radius:24px;outline:none;font-size:14px}
.sendbar button{background:#1a8a4a;color:#fff;border:none;padding:0 20px;border-radius:24px;font-weight:700;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0 12px;z-index:20}
.bottom-nav a{flex:1;text-align:center;text-decoration:none;color:#888;font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center;position:relative}
.bottom-nav a.active{color:#1a8a4a;font-weight:700}
.nav-badge{position:absolute;top:-2px;right:28%;background:#e53935;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
</style>
</head>
<body>

<div class="header">
  <a href="#" id="backBtn" style="display:none">←</a>
  <a href="index.html" id="homeBack">←</a>
  <h1 id="headerTitle">💬 Chats</h1>
</div>

<!-- LIST VIEW -->
<div id="listView">
  <div class="list" id="list"><p style="text-align:center;padding:30px;color:#888">Loading chats...</p></div>
</div>

<!-- CONVERSATION VIEW (inside same file) -->
<div id="convView" class="conv">
  <div class="msgs" id="msgs"></div>
  <div class="sendbar">
    <input id="msgInput" placeholder="Type a message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="chats.html" class="active"><span>💬</span>Chats<span class="nav-badge" id="navChatBadge" style="display:none">0</span></a>
  <a href="my-bookings.html"><span>📅</span>My Bookings</a>
  <a href="owner.html"><span>👤</span>Owner</a>
</nav>

<script>
const supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");

const myPhone = localStorage.getItem('bms_phone') || '';
const myRole = localStorage.getItem('bms_role') || 'customer'; // customer or owner
const myName = localStorage.getItem('bms_name') || 'Me';
const params = new URLSearchParams(location.search);
const openBookingId = params.get('booking_id');

let currentBookingId = null;

// ---------- LIST VIEW ----------
async function loadChats(){
  const listEl = document.getElementById('list');
  let { data: msgs, error } = await supabase.from('messages').select('*').order('created_at',{ascending:false});
  if(error){ listEl.innerHTML = `<p style="text-align:center;padding:30px">Error: ${error.message}</p>`; return; }
  if(!msgs || msgs.length===0){
    listEl.innerHTML = `<div class="empty"><div>💬</div><h3>No chats yet</h3><p>Book a salon to start chatting</p></div>`;
    return;
  }
  // Group by booking_id
  const byBooking = {};
  msgs.forEach(m=>{ if(!byBooking[m.booking_id]) byBooking[m.booking_id]=[]; byBooking[m.booking_id].push(m); });
  const bookingIds = Object.keys(byBooking);
  let { data: bookings } = await supabase.from('bookings').select('*').in('id', bookingIds);
  const bookingMap = {}; (bookings||[]).forEach(b=> bookingMap[b.id]=b);

  let html = ''; let totalUnread = 0;
  for(let bookingId of bookingIds){
    const chatMsgs = byBooking[bookingId];
    const last = chatMsgs[0];
    const booking = bookingMap[bookingId] || {};
    // CUSTOMER sees salon, OWNER sees customer
    let title = 'Chat';
    if(myRole === 'owner'){
      title = booking.customer_name || booking.customer_phone || last.sender_name || 'Customer';
    } else {
      title = booking.salon_name || last.sender_name || 'Salon';
    }
    const avatarLetter = (title[0]||'C').toUpperCase();
    const lastRead = parseInt(localStorage.getItem('bms_chat_read_'+bookingId) || '0');
    const isUnread = new Date(last.created_at).getTime() > lastRead && last.sender_phone !== myPhone;
    if(isUnread) totalUnread++;
    const timeStr = new Date(last.created_at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    html += `<div class="chat-card" onclick="openChat('${bookingId}','${title.replace(/'/g,"")}')">
      <div class="avatar">${avatarLetter}</div>
      <div class="info">
        <div class="top-row"><span class="name">${title}</span><span class="time">${timeStr}</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="last">${last.sender_phone===myPhone?'You: ':''}${last.message||''}</div>
          ${isUnread?`<span class="badge">1</span>`:''}
        </div>
      </div>
    </div>`;
  }
  listEl.innerHTML = html;
  const badge = document.getElementById('navChatBadge');
  if(totalUnread>0){ badge.style.display='flex'; badge.textContent = totalUnread; }
}

// ---------- CONVERSATION VIEW ----------
function openChat(bookingId, title){
  currentBookingId = bookingId;
  document.getElementById('listView').style.display='none';
  document.getElementById('convView').style.display='flex';
  document.getElementById('homeBack').style.display='none';
  document.getElementById('backBtn').style.display='block';
  document.getElementById('headerTitle').textContent = title;
  history.replaceState(null,'','chats.html?booking_id='+bookingId);
  // Mark as read
  localStorage.setItem('bms_chat_read_'+bookingId, Date.now().toString());
  loadMessages();
}
document.getElementById('backBtn').onclick = (e)=>{
  e.preventDefault();
  document.getElementById('convView').style.display='none';
  document.getElementById('listView').style.display='block';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('homeBack').style.display='block';
  document.getElementById('headerTitle').textContent = '💬 Chats';
  history.replaceState(null,'','chats.html');
  loadChats();
};

async function loadMessages(){
  if(!currentBookingId) return;
  let { data } = await supabase.from('messages').select('*').eq('booking_id', currentBookingId).order('created_at',{ascending:true});
  const box = document.getElementById('msgs');
  box.innerHTML = (data||[]).map(m=>`<div class="msg ${m.sender_phone===myPhone?'mine':'theirs'}">${m.message}<small>${new Date(m.created_at).toLocaleString([], {hour:'2-digit', minute:'2-digit'})}</small></div>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentBookingId) return;
  input.value='';
  await supabase.from('messages').insert([{booking_id: currentBookingId, sender_phone: myPhone, sender_name: myName, message: text}]);
  loadMessages();
}
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });

// Auto-refresh conversation
setInterval(()=>{ if(currentBookingId) loadMessages(); }, 3000);

// ---------- START ----------
if(openBookingId){
  // If opened with ?booking_id=, need title - load list first then open
  loadChats().then(async ()=>{
    let { data: b } = await supabase.from('bookings').select('*').eq('id', openBookingId).single();
    let title = 'Chat';
    if(b){
      title = myRole==='owner' ? (b.customer_name || b.customer_phone || 'Customer') : (b.salon_name || 'Salon');
    }
    openChat(openBookingId, title);
  });
} else {
  loadChats();
}
</script>
</body>
                         </html>
