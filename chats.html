<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats - BookMySalon</title>
<meta name="theme-color" content="#2a0a45">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff;color:#111;padding-bottom:90px}
.box{max-width:600px;margin:0 auto;padding:16px}
a{color:#2a0a45;text-decoration:none;font-weight:700}
.card{background:#fff;padding:16px;border-radius:16px;border:1px solid #eee;box-shadow:0 4px 16px rgba(0,0,0,.05);margin:12px 0;cursor:pointer}
.small{font-size:13px;color:#777}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.4;margin:6px 0}
.mine{background:#2a0a45;color:#fff;margin-left:auto}
.theirs{background:#f1f1f1;color:#111}
.input-row{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:10px;display:flex;gap:8px;max-width:600px;margin:0 auto}
.input-row input{flex:1;padding:13px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:15px;outline:none}
.input-row button{background:#2a0a45;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
/* ADD ONLY - White design chat list enhancements */
.card-chat{display:flex;gap:12px;align-items:center;padding:14px 16px}
.avatar{width:48px;height:48px;border-radius:14px;background:#2a0a45;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.last-preview{font-size:13px;color:#666;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-badge{background:#ff0000;color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px;border-radius:20px;display:inline-block}
.badge-role{font-size:10px;padding:3px 7px;border-radius:10px;background:#f3e8ff;color:#2a0a45;font-weight:700}
.meta-row{font-size:11px;color:#999;margin-top:4px}
</style>
</head>
<body>
<div class="box">
<a href="index.html">← Back</a>
<h1 style="margin:12px 0" id="pageTitle">💬 Chats</h1>
<div id="content"><p class="small">Loading...</p></div>
</div>
<div class="input-row" id="inputRow" style="display:none">
<input id="msgInput" placeholder="Type a message...">
<button onclick="sendMsg()">Send</button>
</div>
<script>
// === FIX ADDED: INSTANT HELPERS BEFORE SUPABASE - SO IT NEVER STUCKS ===
function normalizePhone(p){ return (p||'').replace(/[\s\-\(\)\+]/g,''); }
function getLastRead(id){ try{ return localStorage.getItem('bms_chat_read_'+id)||''; }catch(e){ return ''; } }
function showError(msg){
  const el = document.getElementById('content');
  if(el) el.innerHTML = `<div class="card" style="cursor:default"><p class="small">${msg}</p><p style="margin-top:12px"><a href="index.html">← Back to Home</a> • <a href="chats.html?v=200">Reload</a></p></div>`;
}
function showLoginNeeded(isOwner){
  if(isOwner){
    showError(`<h3>🔒 Owner login required</h3><p class="small" style="margin-top:8px">Please log in as salon owner. Chats are only for your salon.</p>`);
  } else {
    showError(`<h3>🔒 Please log in to see chats</h3><p class="small" style="margin-top:8px">Chats are private. You must book with your phone number first. No phone found in this device.</p>`);
  }
  window._blocked = true;
}
// Instant privacy check BEFORE supabase loads
let role = 'customer';
try{ role = localStorage.getItem('bms_role') || 'customer'; }catch(e){}
if(role !== 'owner') role = 'customer';

(function instantPrivacyCheck(){
  if(new URLSearchParams(location.search).get('booking_id')) return;
  const isOwner = role==='owner';
  const salonId = localStorage.getItem('bms_salon_id');
  const custPhoneRaw = localStorage.getItem('bms_customer_phone') || localStorage.getItem('customer_phone') || '';
  const custPhoneClean = normalizePhone(custPhoneRaw);
  if(!isOwner && !custPhoneClean){ showLoginNeeded(false); }
  else if(isOwner && !salonId){ showLoginNeeded(true); }
})();

// Guarantee Loading... disappears after 3s
setTimeout(()=>{
  const el = document.getElementById('content');
  if(el && el.innerHTML.includes('Loading...') && !window._blocked){
    showError('Still loading... Supabase slow or blocked.<br><br>1. Check internet<br>2. Add ?v=200 to URL to force refresh<br>3. If not logged in, you should see "Please log in"');
  }
}, 3000);
window.addEventListener('error', (e)=>{
  console.error(e);
  showError('JS Error: ' + (e.message||'unknown'));
});
// === END INSTANT FIX ===

let supabaseClient = null;
try{
  if(typeof supabase !== 'undefined' && supabase.createClient){
    supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
  } else {
    throw new Error('Supabase CDN not loaded - check internet');
  }
}catch(e){
  showError('Failed to load chat service: '+e.message+'<br><br>Please refresh: <a href="chats.html?v=200">Reload</a>');
}

const params = new URLSearchParams(location.search);
const bookingId = params.get('booking_id');

async function loadList(){
  if(window._blocked) return;
  document.getElementById('pageTitle').textContent = '💬 Chats';
  document.getElementById('inputRow').style.display = 'none';
  
  const isOwner = role==='owner';
  const salonId = localStorage.getItem('bms_salon_id');
  const custPhoneRaw = localStorage.getItem('bms_customer_phone') || localStorage.getItem('customer_phone') || '';
  const custPhoneClean = normalizePhone(custPhoneRaw);

  // === PRIVACY FIX ADDED - MUST BE LOGGED IN ===
  if(!isOwner && !custPhoneClean){
    showLoginNeeded(false);
    return;
  }
  if(isOwner && !salonId){
    showLoginNeeded(true);
    return;
  }

  if(!supabaseClient){
    showError('Chat service not ready. <a href="chats.html?v=200">Tap to reload</a>');
    return;
  }

  let bookings = [];
  try{
    if(isOwner){
      let q = supabaseClient.from('bookings').select('*').order('created_at',{ascending:false});
      if(salonId) q = q.eq('salon_id', salonId);
      const {data, error} = await q;
      if(error) throw error;
      bookings = data||[];
    } else {
      let data = [];
      try{
        if(custPhoneClean){
          const {data: d1, error: e1} = await supabaseClient.from('bookings').select('*').order('created_at',{ascending:false}).limit(200);
          if(e1) throw e1;
          data = (d1||[]).filter(b=> {
            const bp = normalizePhone(b.customer_phone||'');
            return bp===custPhoneClean || b.customer_phone===custPhoneRaw || (custPhoneClean.length>=9 && bp.endsWith(custPhoneClean.slice(-9)));
          });
        } else {
          data = [];
        }
      }catch(inner){
        console.warn('Bookings fetch failed:', inner.message);
        if(isOwner){
          const {data: d1} = await supabaseClient.from('bookings').select('*').limit(50);
          data = d1||[];
        } else {
          data = [];
        }
        if(!data.length && isOwner) throw inner;
      }
      bookings = data;
    }
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="card"><p class="small">Error: '+e.message+'<br><br>Fix in Supabase SQL Editor:<br><code>ALTER TABLE bookings DISABLE ROW LEVEL SECURITY;<br>ALTER TABLE messages DISABLE ROW LEVEL SECURITY;</code></p><p style="margin-top:10px"><a href="chats.html?v=200">Reload</a></p></div>';
    return;
  }

  bookings = bookings.filter(b=> (b.status||'')!=='cancelled');
  if(!bookings.length){ document.getElementById('content').innerHTML = '<div class="card"><p class="small">No active chats. Book a salon to start chatting. Cancelled chats are hidden.</p><p class="small" style="margin-top:8px">Your phone: '+(custPhoneRaw||'not saved')+' | Role: '+role+'</p></div>'; return; }

  const dedupMap = {};
  bookings.forEach(b=>{
    const key = isOwner ? normalizePhone(b.customer_phone||b.customer_name||b.id) : b.salon_id;
    if(!key) return;
    const existing = dedupMap[key];
    if(!existing) dedupMap[key]=b;
    else {
      const d1 = new Date((b.booking_date||'')+'T'+(b.booking_time||'00:00'));
      const d2 = new Date((existing.booking_date||'')+'T'+(existing.booking_time||'00:00'));
      if(d1>d2) dedupMap[key]=b;
    }
  });
  const unique = Object.values(dedupMap);

  const salonIds = [...new Set(unique.map(b=>b.salon_id))].filter(Boolean);
  let salonsById = {};
  if(salonIds.length){
    try{
      let r = await supabaseClient.from('salons').select('id,name').in('id', salonIds);
      if(r.error) r = await supabaseClient.from('salon').select('id,name').in('id', salonIds);
      (r.data||[]).forEach(s=> salonsById[s.id]=s.name);
    }catch(e){}
  }

  const bookingIds = unique.map(b=>b.id);
  let lastMsgById = {};
  let unreadById = {};
  try{
    if(bookingIds.length){
      const {data: msgs} = await supabaseClient.from('messages').select('booking_id,message,created_at,sender_role').in('booking_id', bookingIds).order('created_at',{ascending:false});
      (msgs||[]).forEach(m=>{
        if(!lastMsgById[m.booking_id]) lastMsgById[m.booking_id]=m;
        const shouldCount = isOwner ? m.sender_role==='customer' : m.sender_role==='owner';
        const lastRead = getLastRead(m.booking_id);
        if(shouldCount && (!lastRead || new Date(m.created_at) > new Date(lastRead))){
          unreadById[m.booking_id]=(unreadById[m.booking_id]||0)+1;
        }
      });
    }
  }catch(e){ console.warn('Messages fetch failed:', e.message); }

  document.getElementById('content').innerHTML = unique.map(b=>{
    const isOwnerView = isOwner;
    const salonName = salonsById[b.salon_id] || 'Salon';
    const customerName = b.customer_name || b.customer_phone || 'Customer';
    const title = isOwnerView ? customerName : salonName;
    const subTitle = isOwnerView ? `${b.service||'Booking'} • ${b.booking_date||''} ${b.booking_time||''} • ${b.status||''}` : `${b.service||'Booking'} • ${b.booking_date||''} • ${b.status||''} • ${salonName}`;
    const last = lastMsgById[b.id];
    const preview = last ? `${last.sender_role==='customer' ? (isOwnerView?'Customer: ':'You: ') : (isOwnerView?'You: ':'${salonName}: ')}${(last.message||'').slice(0,40)}` : 'Tap to open chat';
    const unread = unreadById[b.id]||0;
    const avatar = (title[0]||'?').toUpperCase();
    return `
    <div class="card card-chat" onclick="window.location.href='chats.html?booking_id=${b.id}&salon_name=${encodeURIComponent(title)}&salon_id=${b.salon_id}'">
      <div class="avatar">${avatar}</div>
      <div class="info">
        <div class="name">${title} ${unread?`<span class=\"unread-badge\">${unread>9?'9+':unread}</span>`:''} <span class="badge-role">${isOwnerView?'Customer':'Salon'}</span></div>
        <div class="small" style="margin-top:2px">${subTitle}</div>
        <div class="last-preview">${preview}</div>
        <div class="meta-row">💬 Open Chat → ${isOwnerView ? '• '+ (b.customer_phone||'') : ''}</div>
      </div>
    </div>`;
  }).join('') + `<p class="small" style="margin-top:12px;text-align:center;color:#999">Cancelled hidden • ${unique.length} chat thread${unique.length!==1?'s':''} • Grouped by ${isOwner?'customer':'salon'} • Private to you</p>`;
}

async function loadSingle(){
  const name = decodeURIComponent(params.get('salon_name') || 'Chat');
  document.getElementById('pageTitle').textContent = '💬 ' + name;
  document.getElementById('inputRow').style.display = 'flex';
  document.getElementById('content').innerHTML = '<div id="msgs"><p class="small">Loading messages...</p></div><p style="margin-top:10px"><a href="chats.html">← All Chats</a></p>';
  try{
    const { data, error } = await supabaseClient.from('messages').select('*').eq('booking_id', bookingId).order('created_at',{ascending:true});
    if(error) throw error;
    const msgs = data || [];
    const el = document.getElementById('msgs');
    if(!msgs.length) el.innerHTML = '<p class="small">No messages yet. Say hello 👋</p>';
    else el.innerHTML = msgs.map(m=>`<div class="msg ${m.sender_role===role?'mine':'theirs'}">${(m.message||'').replace(/</g,'&lt;')}</div>`).join('');
    try{ localStorage.setItem('bms_chat_read_' + bookingId, new Date().toISOString()); }catch(e){}
  }catch(e){
    document.getElementById('content').innerHTML = '<p class="small">Error loading messages: '+e.message+'</p><p style="margin-top:10px"><a href="chats.html">← All Chats</a></p>';
  }
}
async function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !bookingId) return;
  input.value = '';
  try{
    const {error} = await supabaseClient.from('messages').insert([{ booking_id: bookingId, sender_role: role, message: text }]);
    if(error) throw error;
  }catch(e){
    alert('Failed to send: '+e.message+' - Check RLS on messages table');
  }
  loadSingle();
}
document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });
if(bookingId) { loadSingle(); setInterval(loadSingle, 3000); } else { 
  if(!window._blocked) loadList(); 
}
</script>
</body>
</html>
