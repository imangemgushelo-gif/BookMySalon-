<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Your Salon - BookMySalon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff5f7;padding:20px;padding-bottom:60px}
.box{max-width:500px;margin:0 auto}
h1{font-size:26px} h1 span{color:#ff4d6d}
p{color:#666;margin:8px 0 16px;font-size:14px}
.card{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
label{font-weight:700;font-size:13px;display:block;margin-top:12px}
input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 4px}
.btn{width:100%;background:#ff4d6d;color:white;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px}
.btn-grey{background:#f1f1f1;color:#111;margin-top:8px}
.service-row{display:flex;gap:8px;margin-bottom:8px}
.service-row input{margin:0}
.service-row button{background:#fee2e2;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700}
.success{background:#dcfce7;border:1px solid #86efac;padding:14px;border-radius:12px;display:none;margin-top:14px;font-size:14px}
.small{font-size:13px;color:#777}
a{color:#ff4d6d}
</style>
</head>
<body>
<div class="box">
<h1>Register Your <span>Salon</span></h1>
<p>Join BookMySalon. Customers in East London will find you and book you.</p>

<div class="card">
  <label>Salon Name *</label>
  <input id="salonName" placeholder="e.g. Glamour Hair Salon">

  <label>Your Phone Number *</label>
  <input id="salonPhone" placeholder="e.g. 082 123 4567">
  <p class="small">You will use this number to log into your Dashboard later.</p>

  <label>Address / Area *</label>
  <input id="salonAddress" placeholder="e.g. 12 Oxford Street, Southernwood, East London">

  <label>Salon Photo (shows on Home page)</label>
  <input type="file" id="salonPhoto" accept="image/*">
  <img id="photoPreview" style="width:100%;border-radius:12px;display:none;margin-top:8px;max-height:220px;object-fit:cover">

  <label>Your Services & Prices *</label>
  <div id="servicesList"></div>
  <button class="btn btn-grey" onclick="addServiceRow()" type="button">+ Add Service</button>

  <button class="btn" onclick="registerSalon()" id="registerBtn">Register My Salon →</button>
  <div class="success" id="successMsg">✅ Success! Your salon is now live on BookMySalon.<br><br><a href="index.html">View Home Page →</a> • <a href="dashboard.html">Go to Dashboard →</a></div>
</div>

<p style="text-align:center;margin-top:16px"><a href="index.html">← Back to Home</a> • <a href="dashboard.html">Owner Dashboard</a></p>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");

let services = [{name:'', price:''}];
let selectedPhotoFile = null;

// --- Services ---
function renderServices(){
  const container = document.getElementById('servicesList');
  container.innerHTML = services.map((s,i)=>`
    <div class="service-row">
      <input placeholder="Service e.g. Braids" value="${s.name || ''}" oninput="services[${i}].name=this.value">
      <input placeholder="Price R" type="number" style="width:110px" value="${s.price || ''}" oninput="services[${i}].price=this.value">
      <button type="button" onclick="removeService(${i})">✕</button>
    </div>
  `).join('');
}
function addServiceRow(){ services.push({name:'', price:''}); renderServices(); }
function removeService(i){
  services.splice(i,1);
  if(services.length===0) services.push({name:'', price:''});
  renderServices();
}
renderServices();

// --- Photo Preview ---
document.getElementById('salonPhoto').addEventListener('change', (e)=>{
  selectedPhotoFile = e.target.files[0];
  if(selectedPhotoFile){
    const url = URL.createObjectURL(selectedPhotoFile);
    const preview = document.getElementById('photoPreview');
    preview.src = url;
    preview.style.display = 'block';
  }
});

// --- Upload Photo to Supabase Storage ---
async function uploadPhoto(file){
  const fileName = Date.now() + '-' + file.name.replace(/\s/g,'');
  const { error } = await supabaseClient.storage.from('salon-photos').upload(fileName, file);
  if(error) throw error;
  const { data } = supabaseClient.storage.from('salon-photos').getPublicUrl(fileName);
  return data.publicUrl;
}

// --- Register ---
async function registerSalon(){
  const name = document.getElementById('salonName').value.trim();
  const phone = document.getElementById('salonPhone').value.trim();
  const address = document.getElementById('salonAddress').value.trim();

  if(!name || !phone || !address){
    alert('Please fill in salon name, phone and address');
    return;
  }

  const cleanServices = services.filter(s=>s.name.trim()!=='').map(s=>({name:s.name.trim(), price: parseInt(s.price)||0}));
  if(cleanServices.length===0){
    alert('Please add at least one service');
    return;
  }

  const btn = document.getElementById('registerBtn');
  btn.textContent = 'Registering... Please wait';
  btn.disabled = true;

  try {
    let photo_url = null;
    if(selectedPhotoFile){
      photo_url = await uploadPhoto(selectedPhotoFile);
    }

    const { error } = await supabaseClient.from('salons').insert([{ name, phone, address, services: cleanServices, photo_url }]);
    if(error) throw error;

    document.getElementById('successMsg').style.display = 'block';
    btn.textContent = '✅ Registered!';
    window.scrollTo({top:0, behavior:'smooth'});

  } catch(e){
    alert('Error: ' + e.message);
    btn.textContent = 'Register My Salon →';
    btn.disabled = false;
  }
}
</script>
</body>
  </html>
