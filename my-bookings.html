<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings - BookMySalon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff5f7;padding:20px}
.box{max-width:600px;margin:0 auto}
h1{font-size:26px} h1 span{color:#ff4d6d}
p{color:#666;margin:8px 0 16px;font-size:14px}
.card{background:white;padding:18px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:12px}
input,textarea{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 10px}
.btn{width:100%;background:#ff4d6d;color:white;padding:14px;border:0;border-radius:12px;font-weight:700;cursor:pointer}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:700}
.pending{background:#fef9c3;color:#854d0e}
.confirmed{background:#dcfce7;color:#166534}
.cancelled{background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#777}
.stars{font-size:28px;cursor:pointer;letter-spacing:4px}
.stars span{color:#ddd}
.stars span.active{color:#ffc107}
a{color:#ff4d6d}
/* ADD ONLY - Cancel + Live Location + View */
.btn-cancel{background:#fff;color:#991b1b;border:1.5px solid #fecaca}
.btn-white{background:#fff;color:#2a0a45;border:1.5px solid #2a0a45}
.btn-light{background:#fff;color:#111;border:1.5px solid #e5e5e5}
.dist-badge{font-size:12px;font-weight:700;color:#2a0a45;background:#f3e8ff;padding:4px 8px;border-radius:20px;display:inline-block;margin-top:6px}
.warn{background:#fee2e2;border:1px solid #fecaca;padding:8px;border-radius:10px;font-size:13px;color:#991b1b;margin-top:8px}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{flex:1}
</style>
</head>
<body>
<div class="box">
<h1>My <span>Bookings</span></h1>
<p>Enter your phone number to see status and rate your salon.</p>
<!-- ADD ONLY - Logout, hidden until logged in -->
<p id="logoutRow" style="text-align:right;display:none;margin:0 0 8px"><a href="#" onclick="logoutUser();return false;" style="font-size:13px">🚪 Logout</a></p>
<!-- ADD ONLY - Live Location -->
<div class="card">
<h3 style="font-size:16px">📍 Live Location</h3>
<p class="small" id="locInfo" style="margin:8px 0">See how far each salon is from you.</p>
<button class="btn btn-light" id="locBtn" onclick="useMyLocation()">📍 Use My Location</button>
</div>
<div class="card">
<input id="custPhone" placeholder="Enter your phone number">
<button class="btn" onclick="check()">Check My Bookings →</button>
</div>
<div id="results"></div>
<p style="text-align:center;margin-top:16px"><a href="index.html">← Back to Home</a> • <a href="salon.html">👁️ View Salon</a> • <a href="dashboard.html">👤 Owner Dashboard</a></p>
</div>
<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let selectedRating = 0;
// ADD ONLY - Live Location state
let userLocation = null;
try{
  const saved = localStorage.getItem('bms_user_location');
  if(saved) userLocation = JSON.parse(saved);
}catch(e){}
// ADD ONLY - Phone validation helpers
function normalizePhone(phone){ return (phone||'').replace(/[\s\-\(\)\+]/g,''); }
function isValidSAPhone(phone){
  const cleaned = normalizePhone(phone);
  let p = cleaned;
  if(p.startsWith('27') && p.length===11) p = '0' + p.slice(2);
  if(!/^\d+$/.test(p)) return false;
  if(p.length!==10) return false;
  if(!p.startsWith('0')) return false;
  return true;
}
// ADD ONLY - Live Location helpers
function getSalonLatLng(s){
  if(!s) return null;
  const lat = s.latitude ?? s.lat ?? null;
  const lng = s.longitude ?? s.lng ?? null;
  if(lat!=null && lng!=null) return {lat: parseFloat(lat), lng: parseFloat(lng)};
  return null;
}
function distanceKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function useMyLocation(){
  if(!navigator.geolocation){ alert('Location is not supported on this device.'); return; }
  const btn = document.getElementById('locBtn');
  btn.textContent = '📍 Getting your location...';
  navigator.geolocation.getCurrentPosition((pos)=>{
    userLocation = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    try{ localStorage.setItem('bms_user_location', JSON.stringify(userLocation)); }catch(e){}
    btn.textContent = '📍 Location On ✓ Tap to Refresh';
    document.getElementById('locInfo').textContent = '✅ Location on - distances shown below.';
    check();
  }, ()=>{
    btn.textContent = '📍 Use My Location';
    alert('Could not get location. Please allow Location permission and try again.');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
function updateLocUI(){
  if(userLocation){
    document.getElementById('locBtn').textContent = '📍 Location On ✓ Tap to Refresh';
    document.getElementById('locInfo').textContent = '✅ Location on - distances shown below.';
  }
}
function setStars(n, bookingId){
  selectedRating = n;
  for(let i=1;i<=5;i++){
    document.getElementById('star-'+bookingId+'-'+i).classList.toggle('active', i<=n);
  }
  document.getElementById('rate-btn-'+bookingId).style.display='block';
}
async function check(){
  const phone = document.getElementById('custPhone').value.trim();
  if(!phone){ alert('Enter your phone number'); return; }
  // ADD ONLY - Phone validation
  if(!isValidSAPhone(phone)){ alert('Please enter a valid SA phone number - 10 digits starting with 0, e.g. 082 123 4567'); return; }
  // ADD ONLY - remember customer so they stay logged in
  try{
    localStorage.setItem('bms_role','customer');
    localStorage.setItem('bms_customer_phone', phone);
    updateLogoutVisibility();
  }catch(e){}
  const clean = phone.replace(/\s/g,'');
  const { data, error } = await supabaseClient.from('bookings').select('*, salons(name, address, latitude, longitude, lat, lng)').or(`customer_phone.eq.${phone},customer_phone.eq.${clean}`).order('booking_date',{ascending:false});
  if(error){ alert(error.message); return; }
  if(!data || data.length===0){ document.getElementById('results').innerHTML = `<div class="card">No bookings found for ${phone}.</div>`; return; }
  // ADD ONLY - Detect double bookings + past time
  const seen = {};
  const dupKeys = new Set();
  data.forEach(b=>{
    if(b.status==='cancelled') return;
    const key = b.salon_id + '|' + b.booking_date + '|' + b.booking_time;
    if(seen[key]) dupKeys.add(key);
    seen[key]=true;
  });
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('results').innerHTML = data.map(b=>{
    const cls = b.status==='confirmed'?'confirmed':b.status==='cancelled'?'cancelled':'pending';
    const msg = b.status==='confirmed' ? '✅ Confirmed! Show up on time.' : b.status==='pending' ? '⏳ Waiting for salon to confirm. Check back here.' : '❌ Cancelled by salon. Please book again.';
    // ADD ONLY - Distance + Directions
    let distHtml = '';
    let dirHtml = '';
    if(userLocation){
      const ll = getSalonLatLng(b.salons);
      if(ll){
        const km = distanceKm(userLocation.lat, userLocation.lng, ll.lat, ll.lng);
        const txt = km < 1 ? `${Math.round(km*1000)} m away` : `${km.toFixed(1)} km away`;
        distHtml = `<span class="dist-badge">📍 ${txt}</span>`;
      }
    }
    if(b.salons){
      const ll = getSalonLatLng(b.salons);
      const dest = ll ? `${ll.lat},${ll.lng}` : encodeURIComponent(b.salons.address||b.salons.name||'');
      dirHtml = `<a class="btn btn-white" style="padding:10px;display:block;text-align:center;font-size:13px" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${dest}">🧭 Get Directions</a>`;
    }
    // ADD ONLY - Past time warning + Double booking warning
    let warnHtml = '';
    const isPast = b.booking_date < today && b.status!=='cancelled';
    if(isPast) warnHtml += `<div class="warn">⏰ This booking date has passed. If you missed it, please book again.</div>`;
    const isDup = dupKeys.has(b.salon_id + '|' + b.booking_date + '|' + b.booking_time);
    if(isDup) warnHtml += `<div class="warn">⚠️ Possible double booking - same salon, date & time as another booking. Please cancel one.</div>`;
    // ADD ONLY - Cancel + View Salon buttons
    const canCancel = b.status==='pending' || b.status==='confirmed';
    const cancelBtn = canCancel ? `<button class="btn btn-cancel" style="margin-top:10px" onclick="cancelBooking('${b.id}')">❌ Cancel Booking</button>` : '';
    const viewBtn = `<a class="btn btn-white" style="padding:10px;display:block;text-align:center;font-size:13px;margin-top:10px" href="salon.html?id=${b.salon_id}">👁️ View Salon</a>`;
    let rateBox = '';
    if(b.status==='confirmed'){
      rateBox = `<div style="margin-top:12px;border-top:1px solid #eee;padding-top:12px">
        <b style="font-size:14px">⭐ Rate this salon</b>
        <div class="stars" id="stars-${b.id}">
          <span id="star-${b.id}-1" onclick="setStars(1,'${b.id}')">★</span>
          <span id="star-${b.id}-2" onclick="setStars(2,'${b.id}')">★</span>
          <span id="star-${b.id}-3" onclick="setStars(3,'${b.id}')">★</span>
          <span id="star-${b.id}-4" onclick="setStars(4,'${b.id}')">★</span>
          <span id="star-${b.id}-5" onclick="setStars(5,'${b.id}')">★</span>
        </div>
        <textarea id="comment-${b.id}" placeholder="How was it? (optional)"></textarea>
        <button class="btn" id="rate-btn-${b.id}" style="display:none" onclick="submitRating('${b.salon_id}','${b.id}')">Submit Rating</button>
        <p class="small">Tap a star to rate. Your rating shows on the salon's page.</p>
      </div>`;
    }
    return `<div class="card"><b>${b.salons?.name||'Salon'}</b> <span class="badge ${cls}">${b.status.toUpperCase()}</span><p class="small" style="margin-top:6px">${b.service} - R${b.price} • ${b.booking_date} at ${b.booking_time}</p><p class="small">${b.salons?.address||''} ${distHtml}</p><p style="font-weight:700;margin-top:8px">${msg}</p>${warnHtml}${viewBtn}${dirHtml ? `<div style="margin-top:10px">${dirHtml}</div>` : ''}${cancelBtn}${rateBox}</div>`;
  }).join('');
}
// ADD ONLY - Cancel Booking function
async function cancelBooking(bookingId){
  if(!confirm('Are you sure you want to cancel this booking?')) return;
  const { error } = await supabaseClient.from('bookings').update({status:'cancelled'}).eq('id', bookingId);
  if(error){ alert(error.message); return; }
  alert('Booking cancelled.');
  check();
}
async function submitRating(salonId, bookingId){
  if(selectedRating===0){ alert('Please tap a star first'); return; }
  const phone = document.getElementById('custPhone').value.trim();
  const comment = document.getElementById('comment-'+bookingId).value;
  const { error } = await supabaseClient.from('ratings').insert([{salon_id: salonId, booking_id: bookingId, customer_phone: phone, rating: selectedRating, comment}]);
  if(error){ alert(error.message); return; }
  alert('Thanks! Your rating is saved ⭐');
  selectedRating = 0;
  check();
}
// ADD ONLY - stay logged in helpers for customer
function updateLogoutVisibility(){
  try{
    const hasLogin = localStorage.getItem('bms_customer_phone') || localStorage.getItem('bms_owner_phone');
    document.getElementById('logoutRow').style.display = hasLogin ? 'block' : 'none';
  }catch(e){}
}
function logoutUser(){
  try{
    localStorage.removeItem('bms_role');
    localStorage.removeItem('bms_customer_phone');
    localStorage.removeItem('bms_customer_name');
    localStorage.removeItem('bms_owner_phone');
    localStorage.removeItem('bms_salon_id');
    localStorage.removeItem('bms_user_location');
  }catch(e){}
  window.location.reload();
}
function restoreCustomerSession(){
  try{
    const phone = localStorage.getItem('bms_customer_phone');
    updateLogoutVisibility();
    updateLocUI();
    if(phone){
      document.getElementById('custPhone').value = phone;
      check();
    }
  }catch(e){}
}
restoreCustomerSession();
</script>
</body>
  </html>
