<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySalon - East London</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#fff5f7;color:#1a1a1a;padding-bottom:80px}
header{background:#111;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:20px} header b span{color:#ff4d6d}
header a{background:#ff4d6d;color:white;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.hero{padding:24px 16px;text-align:center}
.hero h1{font-size:32px;line-height:1.1} .hero h1 span{color:#ff4d6d}
.hero p{color:#666;margin:10px 0 16px}
.search{display:flex;gap:8px;max-width:500px;margin:0 auto}
.search input{flex:1;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px}
.search button{background:#ff4d6d;color:white;border:0;padding:13px 18px;border-radius:12px;font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.filters button{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:white;font-weight:600;cursor:pointer}
.filters button.active{background:#111;color:white}
.grid{padding:0 16px;display:grid;gap:16px;max-width:900px;margin:0 auto}
.card{background:white;border:1px solid #eee;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card-top{height:140px;background:linear-gradient(135deg,#ff4d6d,#ff8fa3);display:flex;align-items:center;justify-content:center;font-size:60px}
.card-body{padding:16px}
.badge{font-size:11px;background:#fff0f3;color:#ff4d6d;padding:4px 8px;border-radius:20px;font-weight:700}
.badge-new{background:#e6ffed;color:#15803d}
.card-body h3{margin:8px 0 4px;font-size:19px}
.muted{color:#777;font-size:13px}
.services{margin:12px 0;display:flex;flex-wrap:wrap;gap:8px}
.services span{background:#f7f7f7;padding:6px 10px;border-radius:20px;font-size:13px}
.book-btn{width:100%;background:#111;color:white;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.dir-btn{display:block;text-align:center;background:white;color:#111;border:1.5px solid #ddd;padding:11px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.sheet{background:white;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:40px}
.sheet input,.sheet select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:15px}
.sheet label{font-weight:700;font-size:13px}
.confirm{background:#e6ffed;border:1px solid #a7f3c0;padding:14px;border-radius:12px;display:none;margin-top:12px}
</style>
</head>
<body>

<header><b>BookMy<span>Salon</span></b><div><a href="my-bookings.html" style="background:white;color:#111;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700;margin-right:6px">My Bookings</a><a href="dashboard.html" style="background:white;color:#111;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700;margin-right:6px">Dashboard</a><a href="register.html">+ Register Salon</a></div></header>
<div class="hero">
<h1>Book your next<br><span>glow-up</span> in seconds.</h1>
<p>Real salons in East London. Owned by real people. Book directly.</p>
<div class="search">
<input id="searchInput" placeholder="Search braids, nails, haircut, barber...">
<button onclick="render()">Search</button>
</div>
</div>

<div class="filters" id="filters">
<button class="active" onclick="setArea('All',this)">All Areas</button>
<button onclick="setArea('Mdantsane',this)">Mdantsane</button>
<button onclick="setArea('Southernwood',this)">Southernwood</button>
<button onclick="setArea('Gonubie',this)">Gonubie</button>
<button onclick="setArea('Quigney',this)">Quigney</button>
<button onclick="setArea('Vincent',this)">Vincent</button>
<button onclick="setArea('Beacon Bay',this)">Beacon Bay</button>
</div>

<div class="grid" id="grid"><p style="text-align:center;padding:20px">Loading real salons...</p></div>

<div class="modal" id="modal" onclick="if(event.target==this) closeModal()">
<div class="sheet">
<h2 id="modalTitle">Book Appointment</h2>
<p class="muted" id="modalSalon"></p><br>
<label>Your Name</label>
<input id="custName" placeholder="e.g. Amanda">
<label>Your WhatsApp Number</label>
<input id="custPhone" placeholder="e.g. 073 123 4567">
<label>Service</label>
<select id="serviceSelect"></select>
<label>Date</label>
<input id="bookDate" type="date">
<label>Time</label>
<select id="bookTime"><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select>
<button class="book-btn" onclick="submitBooking()">Confirm Booking</button>
<div class="confirm" id="confirmBox">✅ Booking request sent! Check <b>My Bookings</b> to see if the salon confirms it.</div>
<button class="book-btn" style="background:#eee;color:#111;margin-top:10px" onclick="closeModal()">Close</button>
</div>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let allSalons = [];
let currentArea = 'All';
let currentSalon = null;
let currentSalonId = null;

// ⭐ NEW: Get real average rating for a salon
async function getAverageRating(salonId){
  const { data } = await supabaseClient.from('ratings').select('rating').eq('salon_id', salonId);
  if(!data || data.length===0) return '⭐ New • No ratings yet';
  const avg = data.reduce((a,b)=>a+b.rating,0) / data.length;
  return `⭐ ${avg.toFixed(1)} (${data.length} ${data.length===1?'rating':'ratings'})`;
}

async function loadSalons(){
  const { data, error } = await supabaseClient.from('salons').select('*').order('created_at', {ascending:false});
  if(error){ document.getElementById('grid').innerHTML = '<p>Error loading salons</p>'; return; }
  allSalons = data || [];
  render();
}

async function render(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allSalons.filter(s => {
    const matchesArea = currentArea==='All' || (s.address && s.address.toLowerCase().includes(currentArea.toLowerCase()));
    const matchesSearch = !q || s.name.toLowerCase().includes(q) || (s.services && JSON.stringify(s.services).toLowerCase().includes(q)) || (s.address && s.address.toLowerCase().includes(q));
    return matchesArea && matchesSearch;
  });

  if(filtered.length===0){
    document.getElementById('grid').innerHTML = '<p style="text-align:center;padding:20px">No salons found in this area yet.<br><a href="register.html">Be the first to register</a></p>';
    return;
  }

  // ⭐ NEW: Fetch ratings for all salons at once (faster)
  const { data: allRatings } = await supabaseClient.from('ratings').select('salon_id, rating');
  const ratingMap = {};
  if(allRatings){
    allRatings.forEach(r=>{
      if(!ratingMap[r.salon_id]) ratingMap[r.salon_id] = [];
      ratingMap[r.salon_id].push(r.rating);
    });
  }
  function ratingText(salonId){
    const list = ratingMap[salonId];
    if(!list || list.length===0) return '⭐ New • No ratings yet';
    const avg = list.reduce((a,b)=>a+b,0)/list.length;
    return `⭐ ${avg.toFixed(1)} (${list.length} ${list.length===1?'rating':'ratings'})`;
  }

  document.getElementById('grid').innerHTML = filtered.map(s=>{
    const services = s.services || [];
    const servicesHtml = services.map(sv=>`<span>${sv.name} - R${sv.price}</span>`).join('');
    const emoji = s.name.toLowerCase().includes('barber') ? '💈' : s.name.toLowerCase().includes('nail') ? '💅' : '💇‍♀️';
    return `
    <div class="card">
      <div class="card-top">${emoji}</div>
      <div class="card-body">
        <span class="badge">${s.address || 'East London'}</span> <span class="badge badge-new">${ratingText(s.id)}</span>
        <h3>${s.name}</h3>
        <p class="muted">${s.address || ''} • ${s.phone || ''}</p>
        <div class="services">${servicesHtml || '<span>Services on booking</span>'}</div>
        <button class="book-btn" onclick='openModal(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Book Now →</button>
        <a class="dir-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address + ' East London')}">📍 Get Directions</a>
      </div>
    </div>`;
  }).join('');
}

function setArea(area, el){
  currentArea = area;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function openModal(salon){
  currentSalon = salon;
  currentSalonId = salon.id;
  document.getElementById('modalTitle').innerText = 'Book at ' + salon.name;
  document.getElementById('modalSalon').innerText = salon.address + ' • ' + salon.phone;
  const services = salon.services || [];
  document.getElementById('serviceSelect').innerHTML = services.length>0 ? services.map(s=>`<option value="${s.name}|${s.price}">${s.name} - R${s.price}</option>`).join('') : '<option value="General|0">General Service</option>';
  document.getElementById('confirmBox').style.display='none';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

async function submitBooking(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const serviceVal = document.getElementById('serviceSelect').value;
  const date = document.getElementById('bookDate').value;
  const time = document.getElementById('bookTime').value;
  if(!name || !phone || !date){ alert('Please fill in name, phone and date'); return; }
  const [service, price] = serviceVal.split('|');
  const { error } = await supabaseClient.from('bookings').insert([{ salon_id: currentSalonId, customer_name: name, customer_phone: phone, service: service, price: parseInt(price)||0, booking_date: date, booking_time: time, status: 'pending' }]);
  if(error){ alert(error.message); return; }
  document.getElementById('confirmBox').style.display='block';
}

loadSalons();
</script>
</body>
  </html>
