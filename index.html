<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySalon - Find & Book Salons in East London</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff5f7;padding:20px;padding-bottom:80px}
.box{max-width:600px;margin:0 auto}
h1{font-size:28px} h1 span{color:#ff4d6d}
p{color:#666;margin:8px 0 16px;font-size:14px}
.card{background:white;padding:16px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:14px;overflow:hidden}
input,select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 10px;background:white}
.btn{width:100%;background:#ff4d6d;color:white;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-dark{background:#111}
.btn-grey{background:#f1f1f1;color:#111}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:700}
.live{background:#dcfce7;color:#166534}
.small{font-size:13px;color:#777}
.stars{color:#ffc107}
.tabs{display:flex;gap:8px;margin:16px 0 12px}
.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid #ddd;background:white;font-weight:700;cursor:pointer}
.tabs button.active{background:#111;color:white;border-color:#111}
.service-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:1px solid #eee;border-radius:12px;background:#fff5f7;margin-bottom:8px;cursor:pointer;text-align:left;font-size:14px}
.service-btn b{color:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal.open{display:flex}
.modal-box{background:white;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
.top-links{display:flex;gap:10px;margin-top:10px}
.top-links a{flex:1;text-align:center;background:white;padding:10px;border-radius:12px;text-decoration:none;color:#111;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.success{background:#dcfce7;border:1px solid #86efac;padding:12px;border-radius:12px;display:none;margin-top:10px;font-size:14px}
.star-btn{font-size:32px;cursor:pointer;background:none;border:0;color:#ddd;padding:0 2px}
.star-btn.active{color:#ffc107}
/* GALLERY - up to 10 photos */
.gallery-wrap{position:relative}
.gallery{ display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.gallery::-webkit-scrollbar{display:none}
.gallery img{width:100%;height:220px;object-fit:cover;flex-shrink:0;scroll-snap-align:start;display:block}
.gallery-dots{display:flex;gap:5px;justify-content:center;padding:8px 0 0}
.gallery-dots span{width:6px;height:6px;border-radius:50%;background:#ddd;display:block}
.gallery-dots span.active{background:#ff4d6d;width:14px;border-radius:10px}
.gallery-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:white;font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px}
.gallery-hint{font-size:12px;color:#999;text-align:center;padding:4px 0 0}
</style>
</head>
<body>
<div class="box">
<h1>Find Your <span>Salon</span> 💇‍♀️</h1>
<p>Book braids, cuts, nails & more in East London.</p>

<div class="top-links">
  <a href="register.html">➕ Register Salon</a>
  <a href="dashboard.html">👤 Owner Dashboard</a>
</div>

<div class="tabs">
  <button id="tabHome" class="active" onclick="showTab('home')">🏠 Find Salon</button>
  <button id="tabMy" onclick="showTab('my')">📅 My Bookings</button>
</div>

<!-- HOME TAB -->
<div id="homeTab">
  <input id="searchInput" placeholder="🔍 Search salon or service e.g. Braids" oninput="loadSalons()">
  <select id="areaFilter" onchange="loadSalons()">
    <option value="">📍 All Areas in East London</option>
    <option value="Southernwood">Southernwood</option>
    <option value="Quigney">Quigney</option>
    <option value="Vincent">Vincent</option>
    <option value="Beacon Bay">Beacon Bay</option>
    <option value="Gonubie">Gonubie</option>
    <option value="Mdantsane">Mdantsane</option>
    <option value="Duncan Village">Duncan Village</option>
    <option value="Nahoon">Nahoon</option>
    <option value="Cambridge">Cambridge</option>
    <option value="Amalinda">Amalinda</option>
  </select>
  <div id="salonList"><p class="small">Loading salons...</p></div>
</div>

<!-- MY BOOKINGS TAB -->
<div id="myTab" style="display:none">
  <div class="card">
    <label style="font-weight:700;font-size:13px">Enter your phone number to see your bookings</label>
    <input id="myPhone" placeholder="e.g. 082 123 4567">
    <button class="btn btn-dark" onclick="loadMyBookings()">View My Bookings →</button>
  </div>
  <div id="myBookingsList"></div>
</div>

</div>

<!-- BOOKING MODAL -->
<div class="modal" id="bookingModal">
  <div class="modal-box">
    <div class="row"><h2 id="modalSalonName">Book</h2><button onclick="closeModal()" style="background:#f1f1f1;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer">✕</button></div>
    <p class="small" id="modalSalonAddress"></p>
    <div id="modalServices"></div>
    <label style="font-weight:700;font-size:13px">Your Name</label>
    <input id="customerName" placeholder="Your full name">
    <label style="font-weight:700;font-size:13px">Your Phone</label>
    <input id="customerPhone" placeholder="Your phone number">
    <label style="font-weight:700;font-size:13px">Date</label>
    <input type="date" id="bookingDate">
    <label style="font-weight:700;font-size:13px">Time</label>
    <input type="time" id="bookingTime" value="10:00">
    <button class="btn" onclick="confirmBooking()">Confirm Booking →</button>
    <div class="success" id="bookingSuccess">✅ Booking sent! The salon owner will confirm it. Check My Bookings for status.</div>
  </div>
</div>

<!-- RATING MODAL -->
<div class="modal" id="ratingModal">
  <div class="modal-box">
    <div class="row"><h2>Rate Your Experience ⭐</h2><button onclick="closeRatingModal()" style="background:#f1f1f1;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer">✕</button></div>
    <p class="small" id="ratingSalonName"></p>
    <div style="text-align:center;margin:14px 0">
      <button class="star-btn" onclick="setStars(1)">★</button>
      <button class="star-btn" onclick="setStars(2)">★</button>
      <button class="star-btn" onclick="setStars(3)">★</button>
      <button class="star-btn" onclick="setStars(4)">★</button>
      <button class="star-btn" onclick="setStars(5)">★</button>
    </div>
    <label style="font-weight:700;font-size:13px">Comment (optional)</label>
    <input id="ratingComment" placeholder="How was it? e.g. Great braids, on time!">
    <button class="btn" onclick="submitRating()">Submit Rating →</button>
    <div class="success" id="ratingSuccess">✅ Thank you! Your rating is live.</div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");

let allSalons = [];
let allRatings = {};
let selectedSalon = null;
let selectedService = null;
let ratingBooking = null;
let ratingStars = 0;

function showTab(tab){
  document.getElementById('tabHome').classList.toggle('active', tab==='home');
  document.getElementById('tabMy').classList.toggle('active', tab==='my');
  document.getElementById('homeTab').style.display = tab==='home' ? 'block' : 'none';
  document.getElementById('myTab').style.display = tab==='my' ? 'block' : 'none';
}

async function loadSalons(){
  const { data: salons } = await supabaseClient.from('salons').select('*').order('created_at', {ascending:false});
  const { data: ratings } = await supabaseClient.from('ratings').select('*');
  allSalons = salons || [];
  allRatings = {};
  (ratings||[]).forEach(r=>{
    if(!allRatings[r.salon_id]) allRatings[r.salon_id] = [];
    allRatings[r.salon_id].push(r);
  });
  renderSalons();
}

function getRating(salonId){
  const list = allRatings[salonId] || [];
  if(list.length===0) return {avg:0, count:0};
  const avg = list.reduce((a,b)=>a+b.rating,0)/list.length;
  return {avg, count:list.length};
}

  // Supports: photos[] (up to 10), fallback to single photo_url
  if(s.photos && Array.isArray(s.photos) && s.photos.length>0) return s.photos.slice(0,10);
  if(s.photo_url) return [s.photo_url];
  return [];
}

  }

    return `<img src="${gallery[0]}" style="width:100%;height:220px;object-fit:cover;display:block">`;
  }
  const dots = gallery.map((_,i)=>`
