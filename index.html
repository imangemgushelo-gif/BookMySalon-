<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySalon - Find & Book Salons in East London</title>
<meta name="theme-color" content="#2a0a45">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#fff;color:#111;padding-bottom:90px}
.topbar{background:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:50;border-bottom:1px solid #f0f0f0}
.logo{font-size:30px;font-weight:900;color:#2a0a45}
.logo span{color:#c2a06e}
.topbar p{font-size:13px;color:#666;margin-top:2px}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:12px;border-radius:14px;border:1px solid #e5e5e5;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
.tabs button.active{background:#2a0a45;color:#fff;border-color:#2a0a45}
.search{width:100%;padding:13px 14px 13px 42px;border:1.5px solid #e5e5e5;border-radius:14px;font-size:15px;outline:none}
.searchWrap{position:relative;margin-bottom:10px}
.searchWrap:before{content:"🔍";position:absolute;left:14px;top:13px}
.search:focus{border-color:#2a0a45}
.filterRow{display:flex;gap:8px;margin-bottom:10px}
.filterRow select{width:100%;padding:12px;border:1.5px solid #e5e5e5;border-radius:14px;font-size:14px;font-weight:600;background:#fff;outline:none}
.catRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.catRow::-webkit-scrollbar{display:none}
.catPill{padding:9px 15px;border-radius:20px;border:1.5px solid #e5e5e5;background:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.catPill.active{background:#2a0a45;color:#fff;border-color:#2a0a45}
.actions{display:flex;gap:8px;margin-bottom:16px}
.actions a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:14px;font-weight:700;font-size:14px}
.btn-purple{background:#2a0a45;color:#fff}
.btn-light{background:#f5f0ff;color:#2a0a45;border:1px solid #e9dfff}
.sectionTitle{font-size:18px;font-weight:800;margin:6px 0 12px}
.countText{font-size:13px;color:#777;margin:-6px 0 12px}
.card{background:#fff;border:1px solid #eee;border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.gallery{position:relative;overflow:hidden;background:#f5f5f5}
.galleryScroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.galleryScroll::-webkit-scrollbar{display:none}
.galleryScroll img{width:100%;height:280px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}
.badgeCount{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px}
.badgeCat{position:absolute;top:10px;left:10px;background:#2a0a45;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots span.active{background:#fff;width:18px;border-radius:10px}
.cardBody{padding:14px}
.cardBody h3{font-size:19px}
.cardBody h3 a{color:#111;text-decoration:none}
.salonLink{display:block;text-decoration:none;color:inherit}
.addr{font-size:13px;color:#777;margin:4px 0 8px}
.services{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.services span{background:#f5f0ff;color:#2a0a45;font-size:12px;font-weight:700;padding:6px 10px;border-radius:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{padding:12px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
.btnBook{background:#2a0a45;color:#fff;flex:1}
.btnCall{background:#f1f1f1;color:#111;text-decoration:none;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px}
.btnView{background:#fff;color:#2a0a45;border:1.5px solid #2a0a45;text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;text-align:center}
.empty{text-align:center;padding:40px 10px;color:#777}
.empty b{color:#111;font-size:18px;display:block;margin-bottom:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 18px 28px;max-height:92vh;overflow-y:auto}
.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheetHead h2{font-size:22px}
.close{background:#f1f1f1;border:0;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:15px;outline:none;background:#fff}
input:focus{border-color:#2a0a45}
.serviceBtn{padding:10px 14px;border-radius:20px;border:2px solid #e5e5e5;background:#fff;color:#111;font-weight:700;cursor:pointer;margin:4px 4px 4px 0;font-size:13px}
.serviceBtn.active{background:#2a0a45;color:#fff;border-color:#2a0a45}
.btnFull{width:100%;background:#2a0a45;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}
.btnFull:disabled{opacity:.6}
.success{background:#dcfce7;border:1px solid #86efac;padding:12px;border-radius:12px;color:#166534;font-size:14px;margin-top:12px;display:none}
.bookingItem{background:#fff;border:1px solid #eee;border-radius:16px;padding:14px;margin-bottom:10px}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:800}
.small{font-size:13px;color:#777}
.star{cursor:pointer;color:#ddd;font-size:24px}
.star.on{color:#f59e0b}
.queueLine{font-size:13px;font-weight:800;margin:6px 0 4px}
.queuePill{position:absolute;top:38px;left:10px;background:#fff;color:#111;font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="topbar"><div class="wrap" style="padding:0"><div class="logo">Book<span>My</span>Salon</div><p>Find & book salons in East London • Mdantsane • NU2</p></div></div>
<div class="wrap">
<div class="tabs"><button id="tabFind" class="active" onclick="showTab('find')">🏠 Find Salon</button><button id="tabMy" onclick="showTab('my')">📅 My Bookings</button></div>
<div id="findTab">
<div class="searchWrap"><input class="search" id="searchInput" placeholder="Search salon or service e.g. Braids" oninput="renderSalons()"></div>
<div class="filterRow">
<select id="locationFilter" onchange="onLocationChange(this.value)">
<option value="all">📍 Location: All Areas</option>
<option value="Mdantsane">📍 Mdantsane</option>
<option value="East London">📍 East London</option>
<option value="Duncan Village">📍 Duncan Village</option>
<option value="Quigney">📍 Quigney</option>
<option value="Southernwood">📍 Southernwood</option>
<option value="Vincent">📍 Vincent</option>
<option value="Beacon Bay">📍 Beacon Bay</option>
<option value="Gonubie">📍 Gonubie</option>
</select>
</div>
<div class="catRow" id="catRow">
<button class="catPill active" data-cat="all" onclick="setCategory('all',this)">All</button>
<button class="catPill" data-cat="Barbershop" onclick="setCategory('Barbershop',this)">💈 Barbershop</button>
<button class="catPill" data-cat="Salon" onclick="setCategory('Salon',this)">💇‍♀️ Salon</button>
<button class="catPill" data-cat="Braids" onclick="setCategory('Braids',this)">🧶 Braids</button>
<button class="catPill" data-cat="Nails" onclick="setCategory('Nails',this)">💅 Nails</button>
<button class="catPill" data-cat="Beauty" onclick="setCategory('Beauty',this)">✨ Beauty</button>
<button class="catPill" data-cat="Makeup" onclick="setCategory('Makeup',this)">💄 Makeup</button>
</div>
<div class="actions"><a href="register.html" class="btn-purple">+ Register Salon</a><a href="dashboard.html" class="btn-light">Owner Dashboard</a></div>
<div class="sectionTitle" id="salonSectionTitle">Salons Near You</div>
<div class="countText" id="resultCount"></div>
<div id="salonList"><div class="empty">Loading salons...</div></div>
</div>
<div id="myTab" style="display:none">
<label>Enter your phone number to see your bookings</label>
<input id="myPhone" placeholder="e.g. 073 771 5535">
<button class="btnFull" onclick="loadMyBookings()">View My Bookings</button>
<div id="myBookingsList" style="margin-top:16px"></div>
</div>
</div>
<div class="modal" id="bookingModal" onclick="if(event.target===this) closeBooking()">
<div class="sheet">
<div class="sheetHead"><div><h2 id="bookingSalonName">Salon Name</h2><p class="small" id="bookingSalonAddress"></p><p id="bookingQueue" style="font-weight:800;font-size:14px;margin-top:6px"></p></div><button class="close" onclick="closeBooking()">✕</button></div>
<label>Choose Service</label><div id="serviceList"></div>
<label>Your Name</label><input id="customerName" placeholder="e.g. Sihle">
<label>Your Phone</label><input id="customerPhone" placeholder="e.g. 073 123 4567">
<label>Date</label><input type="date" id="bookingDate">
<label>Time</label><input type="time" id="bookingTime" value="10:00">
<button class="btnFull" id="confirmBtn" onclick="confirmBooking()">Confirm Booking →</button>
<div class="success" id="bookingSuccess">✅ Booking requested! The salon will confirm it. Check My Bookings for status.</div>
</div>
</div>
<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let salons = []; let currentSalon = null; let selectedService = null; let activeCategory='all'; let activeLocation='all';
function normalizePhone(p){ return String(p||'').replace(/[^0-9]/g,''); }
function showTab(tab){ document.getElementById('tabFind').classList.toggle('active', tab==='find'); document.getElementById('tabMy').classList.toggle('active', tab==='my'); document.getElementById('findTab').style.display = tab==='find' ? 'block' : 'none'; document.getElementById('myTab').style.display = tab==='my' ? 'block' : 'none'; }
async function loadSalons(){ const { data, error } = await supabaseClient.from('salons').select('*').order('created_at',{ascending:false}); if(error){ document.getElementById('salonList').innerHTML='<div class="empty"><b>Could not load salons</b>'+error.message+'<br><button class="btnFull" onclick="loadSalons()">Retry</button></div>'; return; } salons = data || []; buildLocationOptions(); renderSalons(); }
function getPhotos(s){ if(s.photos && Array.isArray(s.photos) && s.photos.length>0) return s.photos; if(s.photo_url) return [s.photo_url]; return ['https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80']; }
function getCategory(s){ if(s.category) return s.category; const hay=(s.name+' '+(s.services||[]).map(x=>x.name).join(' ')+' '+(s.description||'')).toLowerCase(); if(hay.includes('barber')||hay.includes('fade')||hay.includes('beard')) return 'Barbershop'; if(hay.includes('nail')) return 'Nails'; if(hay.includes('braid')||hay.includes('wig')||hay.includes('weave')) return 'Braids'; if(hay.includes('makeup')||hay.includes('make-up')) return 'Makeup'; if(hay.includes('beauty')||hay.includes('facial')||hay.includes('lash')) return 'Beauty'; return 'Salon'; }
function getArea(s){ const a=(s.address||'').toLowerCase(); if(a.includes('mdantsane')) return 'Mdantsane'; if(a.includes('nu2')) return 'NU2'; if(a.includes('nu1')) return 'NU1'; if(a.includes('nu3')) return 'NU3'; if(a.includes('nu6')) return 'NU6'; if(a.includes('duncan')) return 'Duncan Village'; if(a.includes('quigney')) return 'Quigney'; if(a.includes('southernwood')) return 'Southernwood'; if(a.includes('vincent')) return 'Vincent'; if(a.includes('beacon')) return 'Beacon Bay'; if(a.includes('gonubie')) return 'Gonubie'; if(a.includes('east london')) return 'East London'; return 'East London'; }
function buildLocationOptions(){ const sel=document.getElementById('locationFilter'); const areas=[...new Set(salons.map(getArea))]; const existing=[...sel.options].map(o=>o.value); areas.forEach(area=>{ if(!existing.includes(area)){ const opt=document.createElement('option'); opt.value=area; opt.textContent='📍 '+area; sel.appendChild(opt); } }); }
// --- QUEUE ---
function queueText(s){ if(!s || !s.queue_enabled) return ''; const w=Number(s.people_waiting||0); const avg=Number(s.avg_service_minutes||30); const total=w*avg; if(w===0) return '🟢 No wait — Walk in now!'; if(total<60) return `⏳ ${w} waiting • ~${total} min wait`; return `⏳ ${w} waiting • ~${Math.floor(total/60)}h ${total%60}m wait`; }
function setCategory(cat,el){
  activeCategory=cat;
  document.querySelectorAll('.catPill').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  document.getElementById('salonSectionTitle').textContent = cat==='all' ? 'Salons Near You' : cat + 's Near You';
  if(salons.length===0) loadSalons();
  renderSalons();
  setTimeout(()=>{ document.getElementById('salonSectionTitle').scrollIntoView({behavior:'smooth',block:'start'}); },80);
}
function onLocationChange(val){ activeLocation=val; renderSalons(); }
function renderSalons(){
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const filtered = salons.filter(s=>{
    if(q){ const st=(s.services||[]).map(x=>x.name).join(' ').toLowerCase(); if(!(s.name.toLowerCase().includes(q) || (s.address||'').toLowerCase().includes(q) || st.includes(q))) return false; }
    if(activeCategory!=='all' && getCategory(s)!==activeCategory) return false;
    if(activeLocation!=='all'){ const addr=(s.address||'').toLowerCase(); if(!addr.includes(activeLocation.toLowerCase())) return false; }
    return true;
  });
  document.getElementById('resultCount').textContent = filtered.length + ' salon'+(filtered.length!==1?'s':'')+' found' + (activeCategory!=='all' ? ' • '+activeCategory : '') + (activeLocation!=='all' ? ' • '+activeLocation : '');
  if(filtered.length===0){ document.getElementById('salonList').innerHTML='<div class="empty"><b>No salons found</b>Try All categories, All Areas, or a different search.<br><button class="btnFull" onclick="setCategory(\'all\',document.querySelector(\'[data-cat=all]\'))">Show All Salons</button></div>'; return; }
  document.getElementById('salonList').innerHTML = filtered.map(s=>{ const photos=getPhotos(s); const cat=getCategory(s); const qText=queueText(s); const services=(s.services||[]).map(x=>`<span>${escapeHtml(x.name)} - R${x.price}</span>`).join(''); return `<div class="card"><a class="salonLink" href="salon.html?id=${s.id}"><div class="gallery"><div class="galleryScroll" id="gal-${s.id}" onscroll="updateDots('${s.id}',${photos.length})">${photos.map(p=>`<img src="${p}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560066984-138dadb4c035?w=800&q=80'">`).join('')}</div><span class="badgeCat">${cat}</span>${qText?`<span class="queuePill">${qText}</span>`:''}${photos.length>1?`<div class="badgeCount"><span id="count-${s.id}">1</span> / ${photos.length}</div><div class="dots" id="dots-${s.id}">${photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>`:''}</div></a><div class="cardBody"><h3><a href="salon.html?id=${s.id}">${escapeHtml(s.name)} →</a></h3><div class="addr">📍 ${escapeHtml(s.address||'')} • ${cat} ${s.owner_name ? '• Owner: '+escapeHtml(s.owner_name) : ''}</div>${qText?`<div class="queueLine">${qText}</div>`:''}<div class="services">${services||'<span>No services listed</span>'}</div><div class="row" style="margin-top:12px"><a class="btnCall" href="tel:${s.owner_phone}">📞 Call</a><a class="btnView" href="salon.html?id=${s.id}">View Salon</a><button class="btn btnBook" onclick="openBooking('${s.id}')">Book Now →</button></div></div></div>`; }).join('');
}
function updateDots(id,total){ const el=document.getElementById('gal-'+id); if(!el) return; const idx=Math.round(el.scrollLeft/el.clientWidth); const c=document.getElementById('count-'+id); if(c) c.textContent=idx+1; document.querySelectorAll('#dots-'+id+' span').forEach((d,i)=>d.classList.toggle('active',i===idx)); }
function escapeHtml(t){ return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openBooking(salonId){ currentSalon=salons.find(s=>s.id===salonId); if(!currentSalon) return; selectedService=(currentSalon.services && currentSalon.services.length>0)?currentSalon.services[0]:null; document.getElementById('bookingSalonName').textContent=currentSalon.name; document.getElementById('bookingSalonAddress').textContent=currentSalon.address||''; document.getElementById('bookingQueue').textContent=queueText(currentSalon); document.getElementById('bookingSuccess').style.display='none'; document.getElementById('customerName').value=''; document.getElementById('customerPhone').value=''; const today=new Date().toISOString().split('T')[0]; document.getElementById('bookingDate').value=today; document.getElementById('bookingDate').min=today; document.getElementById('bookingTime').value='10:00'; const box=document.getElementById('serviceList'); if(!currentSalon.services || currentSalon.services.length===0){ box.innerHTML='<p class="small">No services listed.</p>'; } else { box.innerHTML=currentSalon.services.map((s,i)=>`<button type="button" class="serviceBtn ${i===0?'active':''}" onclick="selectService(${i})">${escapeHtml(s.name)} - R${s.price}</button>`).join(''); } document.getElementById('bookingModal').classList.add('open'); }
function selectService(i){ selectedService=currentSalon.services[i]; document.querySelectorAll('.serviceBtn').forEach((b,idx)=>b.classList.toggle('active',idx===i)); }
function closeBooking(){ document.getElementById('bookingModal').classList.remove('open'); }
async function confirmBooking(){ const customer_name=document.getElementById('customerName').value.trim(); const customer_phone=normalizePhone(document.getElementById('customerPhone').value.trim()); const booking_date=document.getElementById('bookingDate').value; const booking_time=document.getElementById('bookingTime').value; if(!customer_name || !customer_phone){ alert('Please enter your name and phone number'); return; } const btn=document.getElementById('confirmBtn'); btn.textContent='Booking...'; btn.disabled=true; const { error } = await supabaseClient.from('bookings').insert([{salon_id:currentSalon.id,customer_name,customer_phone,service:selectedService?selectedService.name:'Booking',price:selectedService?selectedService.price:0,booking_date:booking_date||new Date().toISOString().split('T')[0],booking_time:booking_time||'10:00',status:'pending'}]); btn.textContent='Confirm Booking →'; btn.disabled=false; if(error){ alert('Error: '+error.message); return; } document.getElementById('bookingSuccess').style.display='block'; setTimeout(()=>{ closeBooking(); showTab('my'); document.getElementById('myPhone').value=customer_phone; loadMyBookings(); },1200); }
async function loadMyBookings(){ const phoneRaw=document.getElementById('myPhone').value.trim(); if(!phoneRaw){ alert('Enter your phone number'); return; } const phoneNorm=normalizePhone(phoneRaw); const { data, error } = await supabaseClient.from('bookings').select('*, salons(name, address)').order('created_at',{ascending:false}); const list=document.getElementById('myBookingsList'); if(error){ list.innerHTML='<div class="empty">Error loading bookings</div>'; return; } const filtered=(data||[]).filter(b=>{ const s=normalizePhone(b.customer_phone); return s===phoneNorm || s.endsWith(phoneNorm.slice(-9)) || phoneNorm.endsWith(s.slice(-9)); }); if(filtered.length===0){ list.innerHTML='<div class="empty"><b>No bookings found</b>Try booking a salon first.</div>'; return; } list.innerHTML=filtered.map(b=>{ const color=b.status==='confirmed'?'background:#dcfce7;color:#166534':b.status==='cancelled'?'background:#fee2e2;color:#991b1b':'background:#fef9c3;color:#854d0e'; return `<div class="bookingItem"><div class="row"><b>${escapeHtml(b.salons?.name||'Salon')}</b><span class="badge" style="${color}">${b.status.toUpperCase()}</span></div><p class="small" style="margin-top:6px">${escapeHtml(b.service)} - R${b.price}<br>📍 ${escapeHtml(b.salons?.address||'')}<br>📅 ${b.booking_date} at ${b.booking_time}</p><div style="margin-top:10px"><span class="small">Rate this salon:</span><div>${[1,2,3,4,5].map(n=>`<span class="star" onclick="rateSalon('${b.salon_id}',${n},this)">★</span>`).join('')}</div></div></div>`; }).join(''); }
async function rateSalon(salonId, rating, el){ const stars=el.parentElement.querySelectorAll('.star'); stars.forEach((s,i)=>s.classList.toggle('on', i<rating)); const { error } = await supabaseClient.from('bookings').update({rating}).eq('salon_id', salonId).eq('customer_phone', normalizePhone(document.getElementById('myPhone').value)); if(error){ console.log('Rating error', error.message); } else { alert('Thanks! You rated '+rating+' stars ⭐'); } }
loadSalons();
</script>
</body>
</html>
