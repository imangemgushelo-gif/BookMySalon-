<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySalon - East London</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#fff5f7;color:#1a1a1a;padding-bottom:80px}
header{background:#111;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:20px} header b span{color:#ff4d6d}
header a{background:#ff4d6d;color:white;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.hero{padding:24px 16px;text-align:center}
.hero h1{font-size:32px;line-height:1.1} .hero h1 span{color:#ff4d6d}
.hero p{color:#666;margin:10px 0 16px}
.search{display:flex;gap:8px;max-width:500px;margin:0 auto}
.search input{flex:1;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px}
.search button{background:#ff4d6d;color:white;border:0;padding:13px 18px;border-radius:12px;font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.filters button{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:white;font-weight:600;cursor:pointer}
.filters button.active{background:#111;color:white}
.grid{padding:0 16px;display:grid;gap:16px;max-width:900px;margin:0 auto}
.card{background:white;border:1px solid #eee;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card-top{height:140px;background:linear-gradient(135deg,#ff4d6d,#ff8fa3);display:flex;align-items:center;justify-content:center;font-size:60px}
.card-body{padding:16px}
.badge{font-size:11px;background:#fff0f3;color:#ff4d6d;padding:4px 8px;border-radius:20px;font-weight:700}
.badge-new{background:#e6ffed;color:#15803d}
.card-body h3{margin:8px 0 4px;font-size:19px}
.muted{color:#777;font-size:13px}
.services{margin:12px 0;display:flex;flex-wrap:wrap;gap:8px}
.services span{background:#f7f7f7;padding:6px 10px;border-radius:20px;font-size:13px}
.book-btn{width:100%;background:#111;color:white;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.dir-btn{display:block;text-align:center;background:white;color:#111;border:1.5px solid #ddd;padding:11px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.sheet{background:white;width:100%;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:40px}
.sheet input,.sheet select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0 12px;font-size:15px}
.sheet label{font-weight:700;font-size:13px}
.confirm{background:#e6ffed;border:1px solid #a7f3c0;padding:14px;border-radius:12px;display:none;margin-top:12px}
</style>
</head>
<body>

<header><b>BookMy<span>Salon</span></b><a href="register.html">+ Register Salon</a></header>

<div class="hero">
<h1>Book your next<br><span>glow-up</span> in seconds.</h1>
<p>Real salons in East London. Owned by real people. Book directly.</p>
<div class="search">
<input id="searchInput" placeholder="Search braids, nails, haircut, barber...">
<button onclick="render()">Search</button>
</div>
</div>

<div class="filters" id="filters">
<button class="active" onclick="setArea('All',this)">All Areas</button>
<button onclick="setArea('Mdantsane',this)">Mdantsane</button>
<button onclick="setArea('Southernwood',this)">Southernwood</button>
<button onclick="setArea('Gonubie',this)">Gonubie</button>
<button onclick="setArea('Quigney',this)">Quigney</button>
<button onclick="setArea('Vincent',this)">Vincent</button>
<button onclick="setArea('Beacon Bay',this)">Beacon Bay</button>
</div>

<div class="grid" id="grid"><p style="text-align:center;padding:20px">Loading real salons...</p></div>

<div class="modal" id="modal" onclick="if(event.target==this) closeModal()">
<div class="sheet">
<h2 id="modalTitle">Book Appointment</h2>
<p class="muted" id="modalSalon"></p><br>
<label>Your Name</label>
<input id="custName" placeholder="e.g. Amanda">
<label>Your WhatsApp Number</label>
<input id="custPhone" placeholder="e.g. 073 123 4567">
<label>Service</label>
<select id="serviceSelect"></select>
<label>Date</label>
<input id="bookDate" type="date">
<label>Time</label>
<select id="bookTime"><option>09:00
