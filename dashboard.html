<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard - BookMySalon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff5f7;padding:20px;padding-bottom:60px}
.box{max-width:600px;margin:0 auto}
h1{font-size:26px} h1 span{color:#ff4d6d}
p{color:#666;margin:8px 0 16px;font-size:14px}
.card{background:white;padding:18px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:12px}
input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;margin:6px 0 10px}
.btn{width:100%;background:#111;color:white;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-pink{background:#ff4d6d} .btn-green{background:#16a34a}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:700}
.pending{background:#fef9c3;color:#854d0e} .confirmed{background:#dcfce7;color:#166534} .cancelled{background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#777}
.actions{display:flex;gap:8px;margin-top:12px} .actions button{flex:1;padding:11px;border-radius:10px;border:0;font-weight:700;cursor:pointer;font-size:13px}
.accept{background:#16a34a;color:white} .reject{background:#ef4444;color:white}
a{color:#ff4d6d}
.tabs{display:flex;gap:6px;margin:16px 0 10px} .tabs button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid #ddd;background:white;font-weight:700;cursor:pointer;font-size:13px} .tabs button.active{background:#111;color:white;border-color:#111}
.rating-big{font-size:32px;font-weight:800;text-align:center} .stars-gold{color:#ffc107;font-size:20px}
.service-row{display:flex;gap:8px;margin-bottom:8px} .service-row input{margin:0} .service-row button{background:#fee2e2;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700}
label{font-weight:700;font-size:13px;display:block;margin-top:8px}
.success{background:#dcfce7;border:1px solid #86efac;padding:12px;border-radius:12px;display:none;margin-top:10px;font-size:14px}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px} .gallery img{width:110px;height:110px;object-fit:cover;border-radius:12px;flex-shrink:0}
</style>
</head>
<body>
<div class="box">
<h1>Owner <span>Dashboard</span></h1>
<p>Manage bookings, reviews and your salon info.</p>
<div class="card"><label>Your Phone Number</label><input id="ownerPhone" placeholder="Enter your phone number"><button class="btn btn-pink" onclick="login()">View My Dashboard →</button></div>
<div id="salonInfo"></div>
<div id="tabs" style="display:none" class="tabs">
  <button id="tabBookings" class="active" onclick="showTab('bookings')">📅 Bookings</button>
  <button id="tabRatings" onclick="showTab('ratings')">⭐ Reviews</button>
  <button id="tabEdit" onclick="showTab('edit')">✏️ Edit Salon</button>
</div>
<div id="bookings"></div><div id="ratings" style="display:none"></div><div id="edit" style="display:none"></div>
<p style="text-align:center;margin-top:16px"><a href="index.html">← Back to Home</a></p>
</div>
<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let mySalonId=null, mySalon=null, editServices=[], newGalleryFiles=[];
function showTab(tab){
  document.getElementById('tabBookings').classList.toggle('active', tab==='bookings');
  document.getElementById('tabRatings').classList.toggle('active', tab==='ratings');
  document.getElementById('tabEdit').classList.toggle('active', tab==='edit');
  document.getElementById('bookings').style.display = tab==='bookings'?'block':'none';
  document.getElementById('ratings').style.display = tab==='ratings'?'block':'none';
  document.getElementById('edit').style.display = tab==='edit'?'block':'none';
  if(tab==='ratings') loadRatings(); if(tab==='bookings') loadBookings(); if(tab==='edit') renderEditForm();
}
async function login(){
  const phone=document.getElementById('ownerPhone').value.trim();
  if(!phone){alert('Please enter your phone number');return;}
  const {data:salons,error}=await supabaseClient.from('salons').select('*').or(`phone.eq.${phone},phone.eq.${phone.replace(/\s/g,'')}`);
  if(error){alert(error.message);return;}
  if(!salons||salons.length===0){document.getElementById('salonInfo').innerHTML=`<div class="card">❌ No salon found.</div>`;return;}
  mySalon=salons[0]; mySalonId=mySalon.id; editServices=[...(mySalon.services||[])];
  document.getElementById('tabs').style.display='flex'; renderSalonHeader(); loadBookings(); loadRatingSummary();
}
function renderSalonHeader(){
  const gallery = mySalon.photos && mySalon.photos.length>0 ? mySalon.photos : (mySalon.photo_url ? [mySalon.photo_url] : []);
  document.getElementById('salonInfo').innerHTML=`
  <div class="card" style="padding:0;overflow:hidden">
    ${gallery.length>0 ? `<div class="gallery" style="padding:0"><img src="${gallery[0]}" style="width:100%;height:200px;border-radius:0;flex-shrink:0"></div>` : ``}
    <div style="padding:18px"><div class="row"><b style="font-size:18px">${mySalon.name}</b><span class="badge confirmed">LIVE</span></div>
    <p class="small">${mySalon.address} • ${mySalon.phone}</p>
    <p class="small">Services: ${mySalon.services?.map(s=>s.name+' - R'+s.price).join(', ')||''}</p>
    <div id="salonRatingSummary" class="small">Loading rating...</div></div>
  </div>`;
}
async function loadRatingSummary(){
  const {data}=await supabaseClient.from('ratings').select('rating').eq('salon_id',mySalonId);
  const el=document.getElementById('salonRatingSummary'); if(!el) return;
  if(!data||data.length===0){el.innerHTML='⭐ New • No ratings yet';return;}
  const avg=data.reduce((a,b)=>a+b.rating,0)/data.length; el.innerHTML=`⭐ <b>${avg.toFixed(1)} average</b> • ${data.length} reviews`;
}
async function loadBookings(){
  const {data}=await supabaseClient.from('bookings').select('*').eq('salon_id',mySalonId).order('booking_date',{ascending:true});
  if(!data||data.length===0){document.getElementById('bookings').innerHTML=`<div class="card">No bookings yet.</div>`;return;}
  document.getElementById('bookings').innerHTML=`<h3>📅 Bookings</h3>`+data.map(b=>{
    const cls=b.status==='confirmed'?'confirmed':b.status==='cancelled'?'cancelled':'pending';
    return `<div class="card"><div class="row"><b>${b.customer_name}</b><span class="badge ${cls}">${b.status.toUpperCase()}</span></div><p class="small">${b.service} - R${b.price} • ${b.booking_date} at ${b.booking_time}</p><p class="small">📞 ${b.customer_phone}</p><div class="actions"><button class="accept" onclick="updateStatus('${b.id}','confirmed')">✅ Confirm</button><button class="reject" onclick="updateStatus('${b.id}','cancelled')">❌ Cancel</button></div></div>`;
  }).join('');
}
async function loadRatings(){
  const {data}=await supabaseClient.from('ratings').select('*').eq('salon_id',mySalonId).order('created_at',{ascending:false});
  if(!data||data.length===0){document.getElementById('ratings').innerHTML=`<div class="card"><h3>⭐ My Reviews</h3><p class="small">No reviews yet.</p></div>`;return;}
  const avg=data.reduce((a,b)=>a+b.rating,0)/data.length;
  document.getElementById('ratings').innerHTML=`<div class="card"><h3>⭐ My Reviews</h3><div class="rating-big">${avg.toFixed(1)} / 5</div><p style="text-align:center" class="small">Based on ${data.length} reviews</p></div>`+data.map(r=>`<div class="card"><div class="row"><span style="color:#ffc107">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><span class="small">${new Date(r.created_at).toLocaleDateString('en-ZA')}</span></div><p>${r.comment||'<span class="small">No comment</span>'}</p></div>`).join('');
}
function renderEditForm(){
  if(!mySalon) return; newGalleryFiles=[];
  const gallery = mySalon.photos && mySalon.photos.length>0 ? mySalon.photos : (mySalon.photo_url ? [mySalon.photo_url] : []);
  document.getElementById('edit').innerHTML=`
  <div class="card"><h3>✏️ Edit My Salon</h3>
  <label>Salon Name</label><input id="editName" value="${mySalon.name||''}">
  <label>Address / Area</label><input id="editAddress" value="${mySalon.address||''}">
  <label>Phone Number</label><input id="editPhone" value="${mySalon.phone||''}">
  <label>Salon Gallery (up to 10 photos)</label>
  <p class="small">Current photos:</p>
  <div class="gallery" id="currentGallery">${gallery.map(u=>`<img src="${u}">`).join('') || '<span class="small">No photos yet</span>'}</div>
  <p class="small" style="margin-top:8px">Upload up to new 10 photos to replace gallery (leave empty to keep current):</p>
  <input type="file" id="editGallery" accept="image/*" multiple onchange="previewNewGallery(event)">
  <div class="gallery" id="newGalleryPreview"></div>
  <label>Your Services & Prices</label><div id="editServicesList"></div>
  <button class="btn" style="background:#f1f1f1;color:#111;margin-bottom:10px" onclick="addServiceRow()">+ Add Service</button>
  <button class="btn btn-green" onclick="saveSalon()" id="saveBtn">💾 Save Changes</button>
  <div class="success" id="saveSuccess">✅ Saved! Your salon is updated.</div></div>`;
  renderServiceRows();
}
function previewNewGallery(e){
  newGalleryFiles = Array.from(e.target.files).slice(0,10);
  const p=document.getElementById('newGalleryPreview'); p.innerHTML='';
  newGalleryFiles.forEach(f=>{ const img=document.createElement('img'); img.src=URL.createObjectURL(f); p.appendChild(img); });
}
async function uploadOnePhoto(file){
  const fn=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+file.name.replace(/\s/g,'');
  const {error}=await supabaseClient.storage.from('salon-photos').upload(fn,file); if(error) throw error;
  const {data}=supabaseClient.storage.from('salon-photos').getPublicUrl(fn); return data.publicUrl;
}
function renderServiceRows(){
  const c=document.getElementById('editServicesList'); if(!c) return;
  if(editServices.length===0) editServices.push({name:'',price:''});
  c.innerHTML=editServices.map((s,i)=>`<div class="service-row"><input placeholder="Service" value="${s.name||''}" oninput="editServices[${i}].name=this.value"><input placeholder="Price R" type="number" style="width:110px" value="${s.price||''}" oninput="editServices[${i}].price=this.value"><button onclick="removeService(${i})">✕</button></div>`).join('');
}
function addServiceRow(){editServices.push({name:'',price:''});renderServiceRows();}
function removeService(i){editServices.splice(i,1); if(editServices.length===0) editServices.push({name:'',price:''}); renderServiceRows();}
async function saveSalon(){
  const name=document.getElementById('editName').value.trim(), address=document.getElementById('editAddress').value.trim(), phone=document.getElementById('editPhone').value.trim();
  if(!name||!address||!phone){alert('Fill name, address and phone');return;}
  const cleanServices=editServices.filter(s=>s.name.trim()!=='').map(s=>({name:s.name.trim(), price:parseInt(s.price)||0}));
  if(cleanServices.length===0){alert('Add at least one service');return;}
  const btn=document.getElementById('saveBtn'); btn.textContent='Saving...'; btn.disabled=true;
  try{
    let photos = mySalon.photos || (mySalon.photo_url ? [mySalon.photo_url] : []);
    let photo_url = mySalon.photo_url;
    if(newGalleryFiles.length>0){
      photos=[];
      for(const f of newGalleryFiles){ photos.push(await uploadOnePhoto(f)); }
      photo_url = photos[0];
    }
    const {error}=await supabaseClient.from('salons').update({name,address,phone,services:cleanServices,photo_url,photos}).eq('id',mySalonId);
    if(error) throw error;
    mySalon={...mySalon,name,address,phone,services:cleanServices,photo_url,photos}; editServices=[...cleanServices]; newGalleryFiles=[];
    renderSalonHeader(); loadRatingSummary();
    document.getElementById('saveSuccess').style.display='block'; btn.textContent='💾 Save Changes'; btn.disabled=false;
  }catch(e){alert(e.message); btn.textContent='💾 Save Changes'; btn.disabled=false;}
}
async function updateStatus(id,status){ await supabaseClient.from('bookings').update({status}).eq('id',id); loadBookings(); }
</script>
</body>
  </html>
