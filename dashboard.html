<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard - BookMySalon</title>
<meta name="theme-color" content="#2a0a45">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "cbc1f3f3-aebe-46e6-95f8-6ceb354120b1",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      allowLocalhostAsSecureOrigin: true,
    });
  });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff;padding:20px;padding-bottom:80px;color:#111}
.box{max-width:600px;margin:0 auto}
.logo{font-size:28px;font-weight:900;color:#2a0a45}
.logo span{color:#c2a06e}
a{color:#2a0a45;text-decoration:none;font-weight:700}
.card{background:#fff;padding:16px;border-radius:16px;border:1px solid #eee;box-shadow:0 4px 16px rgba(0,0,0,.05);margin:14px 0}
input,select{width:100%;padding:13px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:15px;margin:6px 0 10px;outline:none}
.btn{width:100%;background:#2a0a45;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-dark{background:#111}
.btn-small{width:auto;padding:8px 12px;font-size:13px;margin:4px 4px 0 0}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-grey{background:#f1f1f1;color:#111}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:700}
.small{font-size:13px;color:#777}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid #e5e5e5;background:#fff;font-weight:700;cursor:pointer}
.tabs button.active{background:#2a0a45;color:#fff}
.btn-danger{background:#dc2626}
.btn-white{background:#fff;color:#2a0a45;border:1.5px solid #2a0a45}
.btn-light{background:#fff;color:#111;border:1.5px solid #e5e5e5}
.dup-warn{background:#fee2e2;border:1px solid #fecaca;padding:8px;border-radius:10px;font-size:13px;color:#991b1b;margin-top:8px}
.loc-badge{font-size:12px;font-weight:700;color:#166534;background:#dcfce7;padding:4px 8px;border-radius:20px;display:inline-block;margin-top:6px}
/* ADD ONLY - Clean Owner Layout */
.owner-hero{background:#2a0a45;color:#fff;border-radius:18px;padding:20px;margin:12px 0}
.owner-hero p{color:#ddd}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat b{font-size:20px;color:#2a0a45;display:block}
.stat span{font-size:12px;color:#777}
.top-row{display:flex;justify-content:space-between;align-items:center}
/* ADD ONLY - Unread Badge */
.unread-badge{background:#ff0000;color:white;font-size:11px;font-weight:800;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px;border-radius:20px;display:inline-block;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="box">
<div class="top-row">
<div class="logo">Book<span>My</span>Salon</div>
<a href="#" onclick="switchToCustomer();return false;" style="font-size:12px;color:#777">Switch: I'm a Customer ↺</a>
</div>
<p style="margin:10px 0"><a href="index.html">← Back to Welcome</a> <span id="logoutRow" style="display:none;float:right"><a href="#" onclick="logoutUser();return false;" style="font-size:13px;color:#666">🚪 Logout</a></span></p>

<!-- ADD ONLY - Clean Owner Hero -->
<div class="owner-hero">
<h1 style="font-size:26px;line-height:1.2">Hello Owner! 👋<br>Owner Dashboard</h1>
<p class="small" style="margin-top:8px">Manage your bookings, services & profile.</p>
</div>

<div class="card">
<label style="font-weight:700;font-size:13px">Your Salon Phone / Owner Phone</label>
<input id="ownerPhone" placeholder="e.g. 082 123 4567">
<button class="btn btn-dark" onclick="loadDashboard()">Load My Salon →</button>
<p class="small" style="margin-top:10px;text-align:center">No salon yet? <a href="register.html">➕ Register Salon</a></p>
</div>

<!-- ADD ONLY - Stats (filled by JS after load, hidden until then) -->
<div class="stats" id="statsRow" style="display:none">
<div class="stat"><b id="statTotal">0</b><span>Total Bookings</span></div>
<div class="stat"><b id="statPending">0</b><span>Pending</span></div>
<div class="stat"><b id="statConfirmed">0</b><span>Confirmed</span></div>
<div class="stat"><b id="statRating">New</b><span>⭐ Rating</span></div>
</div>

<div id="dashboardContent"></div>
</div>

<!-- ADD ONLY - Edit Salon Modal -->
<div id="editSalonModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:20px;max-width:500px;margin:40px auto;max-height:90vh;overflow-y:auto">
    <h2 style="margin-top:0">Edit Salon</h2>
    <label style="font-weight:700;font-size:13px">Salon Name</label>
    <input id="edit_salon_name">
    <label style="font-weight:700;font-size:13px">Address</label>
    <input id="edit_salon_address">
    <label style="font-weight:700;font-size:13px">Phone</label>
    <input id="edit_salon_phone">
    <label style="font-weight:700;font-size:13px">Description</label>
    <input id="edit_salon_desc">
    <label style="font-weight:700;font-size:13px">Category</label>
    <select id="edit_salon_category">
      <option value="">Select Category</option>
      <option value="Barbershop">💈 Barbershop</option>
      <option value="Salon">💇‍♀️ Salon</option>
      <option value="Braids">🧶 Braids</option>
      <option value="Nails">💅 Nails</option>
      <option value="Beauty">✨ Beauty</option>
      <option value="Makeup">💄 Makeup</option>
    </select>
    <label style="font-weight:700;font-size:13px">Live Location (GPS)</label>
    <p class="small" id="edit_loc_status" style="margin:4px 0 8px">No GPS pin saved yet. Tap below while at your salon.</p>
    <input id="edit_salon_lat" placeholder="Latitude e.g. -32.9836" inputmode="decimal">
    <input id="edit_salon_lng" placeholder="Longitude e.g. 27.8540" inputmode="decimal">
    <button class="btn btn-light" type="button" onclick="captureSalonLocation()">📍 Use My Location - Set Salon Pin</button>
    <button class="btn" onclick="saveEditSalon()" style="margin-top:12px">Save Changes</button>
    <button class="btn" style="background:#eee;color:#111;margin-top:8px" onclick="document.getElementById('editSalonModal').style.display='none'">Cancel</button>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let salon=null, bookings=[];
function normalizePhone(phone){ return (phone||'').replace(/[\s\-\(\)\+]/g,''); }
function isValidSAPhone(phone){
  const cleaned = normalizePhone(phone);
  let p = cleaned;
  if(p.startsWith('27') && p.length===11) p = '0' + p.slice(2);
  if(!/^\d+$/.test(p)) return false;
  if(p.length!==10) return false;
  if(!p.startsWith('0')) return false;
  return true;
}
// ADD ONLY - Switch to Customer (back to Welcome, keep owner login for later)
function switchToCustomer(){
  try{ localStorage.setItem('bms_role','customer'); }catch(e){}
  window.location.href = 'index.html';
}
// ADD ONLY - Unread Badge helpers (owner sees customer messages)
function getLastRead(bookingId){
  try{ return localStorage.getItem('bms_chat_read_' + bookingId) || ''; }catch(e){ return ''; }
}
function markChatRead(bookingId){
  try{ localStorage.setItem('bms_chat_read_' + bookingId, new Date().toISOString()); }catch(e){}
}
async function getUnreadCounts(bookingIds){
  const counts = {};
  if(!bookingIds || bookingIds.length===0) return counts;
  try{
    const { data, error } = await supabaseClient.from('messages').select('booking_id,sender_role,created_at').in('booking_id', bookingIds).eq('sender_role','customer').order('created_at',{ascending:false});
    if(error || !data) return counts;
    data.forEach(m=>{
      const lastRead = getLastRead(m.booking_id);
      if(!lastRead || new Date(m.created_at) > new Date(lastRead)){
        counts[m.booking_id] = (counts[m.booking_id] || 0) + 1;
      }
    });
  }catch(e){}
  return counts;
}
async function loadDashboard(){
  const phone=document.getElementById('ownerPhone').value.trim();
  if(!phone){ alert('Enter your phone'); return; }
  if(!isValidSAPhone(phone)){ alert('Please enter a valid SA phone number - 10 digits starting with 0, e.g. 082 123 4567'); return; }
  const {data:salons} = await supabaseClient.from('salons').select('*').eq('phone',phone);
  if(!salons || !salons.length){
    document.getElementById('dashboardContent').innerHTML='<div class="card">No salon found for this phone. <a href="register.html">Register your salon</a></div>';
    document.getElementById('statsRow').style.display='none';
    return;
  }
  salon=salons[0];
  try{
    localStorage.setItem('bms_role','owner');
    localStorage.setItem('bms_owner_phone', phone);
    localStorage.setItem('bms_salon_id', salon.id);
    window.currentSalon = salon;
    window.salon = salon;
    updateLogoutVisibility();
  }catch(e){}
  const {data} = await supabaseClient.from('bookings').select('*').eq('salon_id',salon.id).order('booking_date',{ascending:false});
  bookings=data||[];
  const {data:ratings} = await supabaseClient.from('ratings').select('*').eq('salon_id',salon.id).order('created_at',{ascending:false});
  const avg = ratings && ratings.length ? (ratings.reduce((a,b)=>a+b.rating,0)/ratings.length).toFixed(1) : 'New';
  const hasLoc = (salon.latitude!=null && salon.longitude!=null) || (salon.lat!=null && salon.lng!=null);
  const locBadge = hasLoc ? `<span class="loc-badge">📍 Live Location Saved ✓</span>` : `<span class="small">📍 No GPS pin yet - tap Edit Salon to set it</span>`;
  // ADD ONLY - Fill Stats
  const pending = bookings.filter(b=>b.status==='pending').length;
  const confirmed = bookings.filter(b=>b.status==='confirmed').length;
  document.getElementById('statsRow').style.display='flex';
  document.getElementById('statTotal').textContent = bookings.length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statConfirmed').textContent = confirmed;
  document.getElementById('statRating').textContent = avg;
  document.getElementById('dashboardContent').innerHTML=`
  <div class="card"><h2>${salon.name}</h2><p class="small">${salon.address||''}</p><p style="margin-top:8px">⭐ ${avg} (${ratings?ratings.length:0} reviews) • ${bookings.length} bookings</p><p style="margin-top:8px">${locBadge}</p></div>
  <div style="display:flex;gap:10px;margin:14px 0">
    <button class="btn" style="background:#fff;color:#111;border:2px solid #111" onclick="openEditSalon()">✏️ Edit Salon</button>
    <button class="btn" onclick="viewMySalon()">👁️ View Salon</button>
  </div>
  <div style="display:flex;gap:10px;margin:0 0 14px">
    <button class="btn btn-light" onclick="quickSetLocation()">📍 Set Live Location</button>
  </div>
  <div class="tabs"><button class="active" id="tB" onclick="showD('b')">📅 Bookings</button><button id="tR" onclick="showD('r')">⭐ Reviews</button><button id="tS" onclick="showD('s')">✂️ Services</button></div>
  <div id="dB"></div><div id="dR" style="display:none"></div><div id="dS" style="display:none"></div>
  <div class="card" style="border-color:#fecaca">
    <h3 style="color:#991b1b">Danger Zone</h3>
    <p class="small" style="margin:8px 0">Deleting your salon will also delete all its bookings and ratings. This cannot be undone.</p>
    <button class="btn btn-danger" onclick="deleteSalon()">🗑️ Delete Salon</button>
    <p style="margin-top:12px;text-align:center"><a href="my-bookings.html">📅 View My Bookings Page →</a></p>
  </div>`;
  renderBookings(); renderReviews(ratings||[]); renderServices();
  try{
    const params = new URLSearchParams(location.search);
    if(params.get('edit')==='1'){ openEditSalon(); history.replaceState(null,'','dashboard.html'); }
  }catch(e){}
}
function showD(t){
  ['b','r','s'].forEach(k=>document.getElementById('t'+k.toUpperCase()).classList.toggle('active',k===t));
  document.getElementById('dB').style.display=t==='b'?'block':'none';
  document.getElementById('dR').style.display=t==='r'?'block':'none';
  document.getElementById('dS').style.display=t==='s'?'block':'none';
}
async function renderBookings(){
  if(!bookings.length){ document.getElementById('dB').innerHTML='<div class="card">No bookings yet.</div>'; return; }
  // ADD ONLY - Unread counts for chat badges
  const unreadCounts = await getUnreadCounts(bookings.map(b=>b.id));
  const seen = {};
  const dupKeys = new Set();
  bookings.forEach(b=>{ if(b.status==='cancelled') return; const key = b.booking_date + '|' + b.booking_time; if(seen[key]) dupKeys.add(key); seen[key]=true; });
  document.getElementById('dB').innerHTML=bookings.map(b=>{
  const isDup = dupKeys.has(b.booking_date + '|' + b.booking_time);
  const dupHtml = isDup ? `<div class="dup-warn">⚠️ Possible double booking - same date & time as another booking. Please cancel one.</div>` : '';
  // ADD ONLY - Chat Button + Unread Badge (owner sees customer messages)
  const unread = unreadCounts[b.id] || 0;
  const unreadBadge = unread > 0 ? `<span class="unread-badge">${unread > 9 ? '9+' : unread}</span>` : '';
  const chatBtn = `<a href="chat.html?booking_id=${b.id}&salon_id=${salon ? salon.id : b.salon_id}&salon_name=${encodeURIComponent(b.customer_name || 'Customer')}" onclick="markChatRead('${b.id}')" class="btn btn-small" style="display:inline-block;text-decoration:none;margin-top:6px;background:#111">💬 Chat with Customer ${unreadBadge}</a>`;
  return `
  <div class="card"><div style="display:flex;justify-content:space-between"><b>${b.customer_name}</b><span class="badge" style="background:#fef9c3">${b.status}</span></div>
  <p class="small" style="margin-top:6px">${b.service} - R${b.price} • ${b.booking_date} at ${b.booking_time}<br>📞 ${b.customer_phone}</p>
  ${dupHtml}
  ${chatBtn}<br>
  ${b.status==='pending'?`<button class="btn btn-small btn-green" onclick="updateBooking('${b.id}','confirmed')">✅ Confirm</button><button class="btn btn-small btn-red" onclick="updateBooking('${b.id}','cancelled')">❌ Cancel</button>`:''}
  ${b.status==='confirmed'?`<button class="btn btn-small btn-red" onclick="updateBooking('${b.id}','cancelled')">❌ Cancel Booking</button>`:''}
  </div>`}).join('');
}
function renderReviews(ratings){
  document.getElementById('dR').innerHTML = !ratings.length ? '<div class="card">No reviews yet.</div>' : ratings.map(r=>`<div class="card">⭐ ${r.rating}<p class="small" style="margin-top:4px">${r.comment||''}</p></div>`).join('');
}
function renderServices(){
  document.getElementById('dS').innerHTML=`<div class="card">${(salon.services||[]).map((s,i)=>`<p style="margin:6px 0">${s.name} - R${s.price} <button class="btn btn-small btn-grey" onclick="removeService(${i})">Remove</button></p>`).join('')||'<p class="small">No services yet.</p>'}
  <input id="newSvcName" placeholder="New service name e.g. Knotless Braids"><input id="newSvcPrice" type="number" placeholder="Price e.g. 450"><button class="btn" onclick="addService()">+ Add Service</button></div>`;
}
async function updateBooking(id,status){
  if(status==='cancelled' && !confirm('Cancel this booking?')) return;
  await supabaseClient.from('bookings').update({status}).eq('id',id);
  loadDashboard();
}
async function addService(){
  const name=document.getElementById('newSvcName').value.trim();
  const price=Number(document.getElementById('newSvcPrice').value);
  if(!name||!price){ alert('Enter name and price'); return; }
  const services=[...(salon.services||[]),{name,price}];
  await supabaseClient.from('salons').update({services}).eq('id',salon.id);
  loadDashboard();
}
async function removeService(i){
  const services=(salon.services||[]).filter((_,idx)=>idx!==i);
  await supabaseClient.from('salons').update({services}).eq('id',salon.id);
  loadDashboard();
}
function openEditSalon(){
  if(!salon){ alert('Load your salon first'); return; }
  document.getElementById('edit_salon_name').value = salon.name || '';
  document.getElementById('edit_salon_address').value = salon.address || '';
  document.getElementById('edit_salon_phone').value = salon.phone || '';
  document.getElementById('edit_salon_desc').value = salon.description || '';
  document.getElementById('edit_salon_category').value = salon.category || '';
  const lat = salon.latitude ?? salon.lat ?? '';
  const lng = salon.longitude ?? salon.lng ?? '';
  document.getElementById('edit_salon_lat').value = lat;
  document.getElementById('edit_salon_lng').value = lng;
  const st = document.getElementById('edit_loc_status');
  if(st) st.textContent = (lat!=='' && lng!=='') ? `✅ GPS pin saved: ${lat}, ${lng}` : 'No GPS pin saved yet. Tap below while at your salon.';
  document.getElementById('editSalonModal').style.display = 'block';
}
async function saveEditSalon(){
  if(!salon) return;
  const updates = {
    name: document.getElementById('edit_salon_name').value.trim(),
    address: document.getElementById('edit_salon_address').value.trim(),
    phone: document.getElementById('edit_salon_phone').value.trim(),
    description: document.getElementById('edit_salon_desc').value.trim()
  };
  if(!updates.name){ alert('Salon name is required'); return; }
  if(!isValidSAPhone(updates.phone)){ alert('Please enter a valid SA phone number - 10 digits starting with 0'); return; }
  const cat = document.getElementById('edit_salon_category').value;
  if(cat) updates.category = cat;
  const latVal = document.getElementById('edit_salon_lat').value.trim();
  const lngVal = document.getElementById('edit_salon_lng').value.trim();
  if(latVal!=='' && lngVal!==''){ updates.latitude = parseFloat(latVal); updates.longitude = parseFloat(lngVal); updates.lat = parseFloat(latVal); updates.lng = parseFloat(lngVal); }
  const { error } = await supabaseClient.from('salons').update(updates).eq('id', salon.id);
  if(error){ alert(error.message); return; }
  alert('Salon updated!');
  document.getElementById('editSalonModal').style.display = 'none';
  try{ localStorage.setItem('bms_owner_phone', updates.phone); }catch(e){}
  document.getElementById('ownerPhone').value = updates.phone;
  loadDashboard();
}
function viewMySalon(){
  if(salon && salon.id){ window.location.href = 'salon.html?id=' + salon.id; }
  else { const savedId = localStorage.getItem('bms_salon_id'); if(savedId) window.location.href = 'salon.html?id=' + savedId; else alert('Load your salon first'); }
}
function captureSalonLocation(){
  if(!navigator.geolocation){ alert('Location is not supported on this device.'); return; }
  const st = document.getElementById('edit_loc_status');
  if(st) st.textContent = '📍 Getting your location...';
  navigator.geolocation.getCurrentPosition((pos)=>{
    document.getElementById('edit_salon_lat').value = pos.coords.latitude.toFixed(6);
    document.getElementById('edit_salon_lng').value = pos.coords.longitude.toFixed(6);
    if(st) st.textContent = `✅ Location captured: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} - Tap Save Changes to save it.`;
    try{ localStorage.setItem('bms_user_location', JSON.stringify({lat: pos.coords.latitude, lng: pos.coords.longitude})); }catch(e){}
  }, ()=>{ if(st) st.textContent = 'Could not get location. Please allow Location permission.'; alert('Could not get location. Please allow Location permission and try again.'); }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
async function quickSetLocation(){
  if(!salon){ alert('Load your salon first'); return; }
  if(!navigator.geolocation){ alert('Location is not supported.'); return; }
  if(!confirm('Set this salon location to your current GPS location? Make sure you are at your salon.')) return;
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const lat = pos.coords.latitude; const lng = pos.coords.longitude;
    const { error } = await supabaseClient.from('salons').update({latitude: lat, longitude: lng, lat: lat, lng: lng}).eq('id', salon.id);
    if(error){ alert(error.message); return; }
    alert('✅ Live Location saved for your salon! Customers will now see how far you are.');
    loadDashboard();
  }, ()=>{ alert('Could not get location. Please allow Location permission.'); }, {enableHighAccuracy:true, timeout:10000});
}
async function deleteSalon(){
  if(!salon){ alert('Load your salon first'); return; }
  if(!confirm('Are you SURE you want to delete this salon? This will delete the salon and all its bookings and ratings. This cannot be undone.')) return;
  const confirm2 = prompt('Type DELETE to confirm deleting "' + salon.name + '":');
  if(confirm2 !== 'DELETE'){ alert('Delete cancelled. You did not type DELETE.'); return; }
  await supabaseClient.from('bookings').delete().eq('salon_id', salon.id);
  await supabaseClient.from('ratings').delete().eq('salon_id', salon.id);
  const { error } = await supabaseClient.from('salons').delete().eq('id', salon.id);
  if(error){ alert(error.message); return; }
  try{ localStorage.removeItem('bms_role'); localStorage.removeItem('bms_owner_phone'); localStorage.removeItem('bms_salon_id'); }catch(e){}
  alert('Salon deleted.');
  window.location.href = 'index.html';
}
function updateLogoutVisibility(){
  try{ const hasLogin = localStorage.getItem('bms_owner_phone'); document.getElementById('logoutRow').style.display = hasLogin ? 'inline' : 'none'; }catch(e){}
}
function logoutUser(){
  try{ localStorage.removeItem('bms_role'); localStorage.removeItem('bms_owner_phone'); localStorage.removeItem('bms_salon_id'); localStorage.removeItem('bms_customer_phone'); localStorage.removeItem('bms_customer_name'); }catch(e){}
  window.location.href = 'index.html';
}
function restoreOwnerSession(){
  try{
    const savedPhone = localStorage.getItem('bms_owner_phone');
    const role = localStorage.getItem('bms_role');
    updateLogoutVisibility();
    if(role === 'owner' && savedPhone){ document.getElementById('ownerPhone').value = savedPhone; loadDashboard(); }
  }catch(e){}
}
restoreOwnerSession();
</script>
</body>
</html>
