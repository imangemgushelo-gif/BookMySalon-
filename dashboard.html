<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard - BookMySalon</title>
<meta name="theme-color" content="#2a0a45">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "cbc1f3f3-aebe-46e6-95f8-6ceb354120b1",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      allowLocalhostAsSecureOrigin: true,
    });
  });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff;padding:20px;padding-bottom:80px;color:#111}
.box{max-width:600px;margin:0 auto}
.logo{font-size:28px;font-weight:900;color:#2a0a45}
.logo span{color:#c2a06e}
a{color:#2a0a45;text-decoration:none;font-weight:700}
.card{background:#fff;padding:16px;border-radius:16px;border:1px solid #eee;box-shadow:0 4px 16px rgba(0,0,0,.05);margin:14px 0}
input,select{width:100%;padding:13px;border:1.5px solid #e5e5e5;border-radius:12px;font-size:15px;margin:6px 0 10px;outline:none}
.btn{width:100%;background:#2a0a45;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-dark{background:#111}
.btn-small{width:auto;padding:8px 12px;font-size:13px;margin:4px 4px 0 0}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-grey{background:#f1f1f1;color:#111}
.badge{font-size:11px;padding:4px 8px;border-radius:20px;font-weight:700}
.small{font-size:13px;color:#777}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid #e5e5e5;background:#fff;font-weight:700;cursor:pointer}
.tabs button.active{background:#2a0a45;color:#fff}
</style>
</head>
<body>
<div class="box">
<div class="logo">Book<span>My</span>Salon</div>
<p style="margin:10px 0"><a href="index.html">← Back to home</a></p>
<h1>Owner Dashboard 👤</h1>
<p class="small">Manage your bookings, services & profile.</p>

<div class="card">
<label style="font-weight:700;font-size:13px">Your Salon Phone / Owner Phone</label>
<input id="ownerPhone" placeholder="e.g. 082 123 4567">
<button class="btn btn-dark" onclick="loadDashboard()">Load My Salon →</button>
</div>

<div id="dashboardContent"></div>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");
let salon=null, bookings=[];
async function loadDashboard(){
  const phone=document.getElementById('ownerPhone').value.trim();
  if(!phone){ alert('Enter your phone'); return; }
  const {data:salons} = await supabaseClient.from('salons').select('*').eq('phone',phone);
  if(!salons || !salons.length){
    document.getElementById('dashboardContent').innerHTML='<div class="card">No salon found for this phone. <a href="register.html">Register your salon</a></div>';
    return;
  }
  salon=salons[0];
  const {data} = await supabaseClient.from('bookings').select('*').eq('salon_id',salon.id).order('booking_date',{ascending:false});
  bookings=data||[];
  const {data:ratings} = await supabaseClient.from('ratings').select('*').eq('salon_id',salon.id).order('created_at',{ascending:false});
  const avg = ratings && ratings.length ? (ratings.reduce((a,b)=>a+b.rating,0)/ratings.length).toFixed(1) : 'New';
  document.getElementById('dashboardContent').innerHTML=`
  <div class="card"><h2>${salon.name}</h2><p class="small">${salon.address||''}</p><p style="margin-top:8px">⭐ ${avg} (${ratings?ratings.length:0} reviews) • ${bookings.length} bookings</p></div>
  <div class="tabs"><button class="active" id="tB" onclick="showD('b')">📅 Bookings</button><button id="tR" onclick="showD('r')">⭐ Reviews</button><button id="tS" onclick="showD('s')">✂️ Services</button></div>
  <div id="dB"></div><div id="dR" style="display:none"></div><div id="dS" style="display:none"></div>`;
  renderBookings(); renderReviews(ratings||[]); renderServices();
}
function showD(t){
  ['b','r','s'].forEach(k=>document.getElementById('t'+k.toUpperCase()).classList.toggle('active',k===t));
  document.getElementById('dB').style.display=t==='b'?'block':'none';
  document.getElementById('dR').style.display=t==='r'?'block':'none';
  document.getElementById('dS').style.display=t==='s'?'block':'none';
}
function renderBookings(){
  if(!bookings.length){ document.getElementById('dB').innerHTML='<div class="card">No bookings yet.</div>'; return; }
  document.getElementById('dB').innerHTML=bookings.map(b=>`
  <div class="card"><div style="display:flex;justify-content:space-between"><b>${b.customer_name}</b><span class="badge" style="background:#fef9c3">${b.status}</span></div>
  <p class="small" style="margin-top:6px">${b.service} - R${b.price} • ${b.booking_date} at ${b.booking_time}<br>📞 ${b.customer_phone}</p>
  ${b.status==='pending'?`<button class="btn btn-small btn-green" onclick="updateBooking('${b.id}','confirmed')">✅ Confirm</button><button class="btn btn-small btn-red" onclick="updateBooking('${b.id}','cancelled')">❌ Cancel</button>`:''}
  </div>`).join('');
}
function renderReviews(ratings){
  document.getElementById('dR').innerHTML = !ratings.length ? '<div class="card">No reviews yet.</div>' : ratings.map(r=>`<div class="card">⭐ ${r.rating}<p class="small" style="margin-top:4px">${r.comment||''}</p></div>`).join('');
}
function renderServices(){
  document.getElementById('dS').innerHTML=`<div class="card">${(salon.services||[]).map((s,i)=>`<p style="margin:6px 0">${s.name} - R${s.price} <button class="btn btn-small btn-grey" onclick="removeService(${i})">Remove</button></p>`).join('')||'<p class="small">No services yet.</p>'}
  <input id="newSvcName" placeholder="New service name e.g. Knotless Braids"><input id="newSvcPrice" type="number" placeholder="Price e.g. 450"><button class="btn" onclick="addService()">+ Add Service</button></div>`;
}
async function updateBooking(id,status){
  await supabaseClient.from('bookings').update({status}).eq('id',id);
  loadDashboard();
}
async function addService(){
  const name=document.getElementById('newSvcName').value.trim();
  const price=Number(document.getElementById('newSvcPrice').value);
  if(!name||!price){ alert('Enter name and price'); return; }
  const services=[...(salon.services||[]),{name,price}];
  await supabaseClient.from('salons').update({services}).eq('id',salon.id);
  loadDashboard();
}
async function removeService(i){
  const services=(salon.services||[]).filter((_,idx)=>idx!==i);
  await supabaseClient.from('salons').update({services}).eq('id',salon.id);
  loadDashboard();
}
</script>
</body>
</html>
