<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - BookMySalon</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#fff5f7;padding:0;display:flex;flex-direction:column;height:100vh}
.top{background:white;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;align-items:center;gap:10px}
.top b{font-size:17px}
.top span{font-size:12px;color:#666;display:block}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}
.mine{background:#ff4d6d;color:white;align-self:flex-end;border-bottom-right-radius:4px}
.theirs{background:white;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.time{font-size:11px;opacity:.7;margin-top:4px}
.bottom{background:white;padding:12px;display:flex;gap:8px;border-top:1px solid #eee}
.bottom input{flex:1;padding:13px;border:1.5px solid #ddd;border-radius:25px;font-size:15px;outline:none}
.bottom button{background:#ff4d6d;color:white;border:0;padding:13px 20px;border-radius:25px;font-weight:700;cursor:pointer}
.back{font-size:20px;text-decoration:none;color:#111}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="javascript:history.back()">←</a>
  <div><b id="chatTitle">💬 Chat</b><span id="chatSub">Booking chat</span></div>
</div>

<div id="msgs"><p style="text-align:center;color:#888;font-size:13px;margin-top:20px">No messages yet. Say hi 👋</p></div>

<div class="bottom">
  <input id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button onclick="sendMsg()">Send</button>
</div>

<script>
const supabaseClient = supabase.createClient("https://zkkyslypjukewacipyey.supabase.co", "sb_publishable_l1F1qMQCNL3SJ253UKmxag__KEoUYHZ");

const params = new URLSearchParams(location.search);
const bookingId = params.get('booking_id');
const salonId = params.get('salon_id');
const salonName = params.get('salon_name') || 'Salon';

let myRole = localStorage.getItem('bms_role') || 'customer'; // customer or owner
let myPhone = localStorage.getItem('bms_customer_phone') || localStorage.getItem('bms_owner_phone') || '';
let myName = localStorage.getItem('bms_customer_name') || localStorage.getItem('bms_owner_name') || myPhone || 'Me';

document.getElementById('chatTitle').textContent = '💬 ' + decodeURIComponent(salonName);
document.getElementById('chatSub').textContent = myRole === 'owner' ? 'You are chatting as Owner' : 'You are chatting as Customer';

async function loadMsgs(){
  if(!bookingId) return;
  const { data } = await supabaseClient.from('messages').select('*').eq('booking_id', bookingId).order('created_at',{ascending:true});
  const box = document.getElementById('msgs');
  if(!data || data.length===0){ box.innerHTML = '<p style="text-align:center;color:#888;font-size:13px;margin-top:20px">No messages yet. Say hi 👋</p>'; return; }
  box.innerHTML = data.map(m=>{
    const isMine = m.sender_role === myRole;
    const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    return `<div class="bubble ${isMine?'mine':'theirs'}">${m.message.replace(/</g,'&lt;')}<div class="time">${m.sender_name||''} • ${time}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  if(!bookingId){ alert('No booking linked to this chat'); return; }
  input.value = '';
  const { error } = await supabaseClient.from('messages').insert([{
    booking_id: bookingId,
    salon_id: salonId,
    sender_role: myRole,
    sender_phone: myPhone,
    sender_name: myName,
    message: text
  }]);
  if(error) alert(error.message);
  else loadMsgs();
}

// Realtime - new messages appear instantly
if(bookingId){
  supabaseClient.channel('chat-'+bookingId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:'booking_id=eq.'+bookingId}, ()=> loadMsgs())
    .subscribe();
}
loadMsgs();
</script>
</body>
    </html>
